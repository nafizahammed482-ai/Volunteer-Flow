<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>রিকোয়েস্ট প্যানেল - Volunteer Flow</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f8faf8;
            --bg-secondary: #f0f5f0;
            --fg: #1a2e1a;
            --muted: #2d4a2d;
            --accent: #16a34a;
            --accent-dark: #15803d;
            --accent-light: #dcfce7;
            --card: #ffffff;
            --card-hover: #f1f8f1;
            --border: #cbd5cb;
            --glow: rgba(22, 163, 74, 0.15);
            --shadow: rgba(0, 0, 0, 0.05);
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --purple: #8b5cf6;
            --purple-light: #ede9fe;
            --success: #10b981;
            --orange: #f97316;
            --orange-light: #ffedd5;
        }

        [data-theme="dark"] {
            --bg: #0a1a0a;
            --bg-secondary: #0f240f;
            --fg: #eaf5ea;
            --muted: #6ba36b;
            --accent: #22c55e;
            --accent-dark: #16a34a;
            --accent-light: #14532d;
            --card: #132713;
            --card-hover: #1a3a1a;
            --border: #2a452a;
            --glow: rgba(34, 197, 94, 0.3);
            --shadow: rgba(0, 0, 0, 0.2);
            --danger: #f87171;
            --danger-light: #450a0a;
            --warning: #fbbf24;
            --warning-light: #451a03;
            --info: #60a5fa;
            --info-light: #1e3a5f;
            --purple: #a78bfa;
            --purple-light: #2e1065;
            --orange: #fb923c;
            --orange-light: #431407;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }

        .header-inner {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--accent) 0%, #4ade80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .header-icon:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.05);
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Back Button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 8px 16px;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .back-btn:hover {
            color: var(--accent);
            background: var(--card-hover);
            transform: translateX(-3px);
        }

        /* Page Header */
        .page-header {
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Poppins', sans-serif;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-subtitle {
            font-size: 13px;
            color: var(--muted);
        }

        /* Tab Switch */
        .tab-switch {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .tab-switch-btn {
            flex: 1;
            padding: 10px 8px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: 'Hind Siliguri', sans-serif;
            background: transparent;
            color: var(--muted);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-switch-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 10px var(--glow);
        }

        .tab-switch-btn .badge {
            background: rgba(255,255,255,0.3);
            color: white;
            font-size: 10px;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .tab-switch-btn:not(.active) .badge {
            background: var(--accent);
            color: white;
        }

        /* Search Card */
        .search-card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px var(--shadow);
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg);
            color: var(--fg);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .search-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .search-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px var(--glow);
        }

        .filter-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-select {
            flex: 1;
            min-width: 120px;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg);
            color: var(--fg);
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        @media (max-width: 550px) {
            .filter-row {
                flex-direction: column;
            }
            .search-box {
                flex-direction: column;
            }
            .search-btn {
                justify-content: center;
            }
        }

        /* Count Badge */
        .count-badge {
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 10px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .count-badge i {
            color: var(--accent);
            margin-right: 6px;
        }

        .refresh-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--accent);
        }

        .refresh-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* Request List */
        .request-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Request Card */
        .request-card {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .request-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--glow);
        }

        .request-card.urgent {
            border-left: 4px solid var(--danger);
            background: linear-gradient(135deg, rgba(239,68,68,0.03) 0%, var(--card) 30%);
        }

        /* Urgency Badge */
        .urgency-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 1;
        }

        .urgency-badge.critical {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
        }

        .urgency-badge.high {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .urgency-badge.medium {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: white;
        }

        .urgency-badge.low {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .request-card-inner {
            padding: 16px;
        }

        .request-top {
            display: flex;
            gap: 14px;
            margin-bottom: 14px;
        }

        .blood-group-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            font-family: 'Poppins', sans-serif;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(220,38,38,0.3);
        }

        .request-info {
            flex: 1;
            min-width: 0;
        }

        .patient-name {
            font-weight: 700;
            font-size: 17px;
            color: var(--fg);
            margin-bottom: 4px;
        }

        .patient-problem {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .request-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: var(--muted);
        }

        .request-meta span {
            background: var(--bg-secondary);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .request-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
            padding: 12px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .detail-item i {
            width: 16px;
            color: var(--accent);
            font-size: 12px;
        }

        .request-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
        }

        .status-pending {
            background: var(--warning-light);
            color: var(--warning);
        }

        .status-accepted {
            background: var(--accent-light);
            color: var(--accent);
        }

        .status-rejected {
            background: var(--danger-light);
            color: var(--danger);
        }

        .status-completed {
            background: var(--info-light);
            color: var(--info);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            border: none;
            font-family: 'Hind Siliguri', sans-serif;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-accept {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
        }

        .btn-accept:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px var(--glow);
        }

        .btn-reject {
            background: var(--danger-light);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-reject:hover {
            background: var(--danger);
            color: white;
        }

        .btn-call {
            background: var(--info-light);
            color: var(--info);
            border: 1px solid var(--info);
        }

        .btn-call:hover {
            background: var(--info);
            color: white;
        }

        .btn-chat {
            background: var(--purple-light);
            color: var(--purple);
            border: 1px solid var(--purple);
        }

        .btn-chat:hover {
            background: var(--purple);
            color: white;
        }

        .btn-complete {
            background: var(--warning-light);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .btn-complete:hover {
            background: var(--warning);
            color: white;
        }

        /* Reject Reason */
        .reject-reason {
            margin-top: 10px;
            padding: 8px 12px;
            background: var(--danger-light);
            border-radius: 12px;
            font-size: 12px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Donor Info */
        .donor-info {
            margin-top: 10px;
            padding: 10px 12px;
            background: var(--accent-light);
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card);
            border-radius: 24px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--danger);
            color: white;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--fg);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg);
            color: var(--fg);
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .modal-btn-primary {
            background: var(--accent);
            color: white;
        }

        .modal-btn-primary:hover {
            background: var(--accent-dark);
        }

        .modal-btn-danger {
            background: var(--danger);
            color: white;
        }

        .modal-btn-danger:hover {
            background: #dc2626;
        }

        .modal-btn-secondary {
            background: var(--bg-secondary);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            z-index: 300;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* Points Toast */
        .points-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            z-index: 1001;
            animation: fadeInOut 2.5s ease;
            white-space: nowrap;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* Loading & Empty States */
        .loading-placeholder, .empty-placeholder {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
        }

        .loading-placeholder i, .empty-placeholder i {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
            opacity: 0.4;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent, var(--bg) 20%);
            padding-top: 20px;
            z-index: 100;
        }

        .bottom-nav-inner {
            display: flex;
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            box-shadow: 0 -4px 15px var(--shadow);
        }

        .bottom-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            position: relative;
        }

        .bottom-tab.active {
            color: var(--accent);
        }

        .bottom-tab i {
            font-size: 1.3rem;
        }

        .bottom-tab span {
            font-size: 0.7rem;
        }

        .bottom-tab .badge {
            position: absolute;
            top: 0;
            right: calc(50% - 20px);
            background: var(--danger);
            color: white;
            font-size: 0.6rem;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 280px;
            height: 100vh;
            background: var(--card);
            border-left: 1px solid var(--border);
            transition: right 0.3s ease;
            z-index: 99;
            overflow-y: auto;
            padding: 20px;
            box-shadow: -4px 0 20px var(--shadow);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;

        .sidebar-item:hover {
            background: var(--bg-secondary);
            color: var(--accent);
            transform: translateX(5px);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: 12px;
            background: var(--bg-secondary);

        .theme-toggle button {

    </style>
</head>

            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBkbx3T_QrtgHWCfAv_6Tltc_W5YxrFH-Q",
            authDomain: "bbds-blood-network.firebaseapp.com",
            databaseURL: "https://bbds-blood-network-default-rtdb.firebaseio.com",
            projectId: "bbds-blood-network",
            storageBucket: "bbds-blood-network.firebasestorage.app",
            messagingSenderId: "865903022296",
            appId: "1:865903022296:web:5322b0370c68e049fc87ad"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // ==================== GLOBAL VARIABLES ====================
        let allRequests = [];
        let currentTab = 'all';
        let rejectTargetId = null;
        let completeTargetId = null;
        let currentVolunteerId = null;
        let currentVolunteerName = 'ভলান্টিয়ার';
        let allRequestsListener = null;

        // ==================== VOLUNTEER INFO ====================
        async function getCurrentVolunteer() {
            return new Promise((resolve) => {
                const userId = localStorage.getItem('userId');
                const userName = localStorage.getItem('userName');
                const userRole = localStorage.getItem('userRole');
                
                if (userId && userName && (userRole === 'volunteer' || userRole === 'admin')) {
                    currentVolunteerId = userId;
                    currentVolunteerName = userName;
                    console.log("✅ Volunteer loaded:", currentVolunteerId, currentVolunteerName);
                    resolve();
                } else {
                    auth.onAuthStateChanged(async (user) => {
                        if (user) {
                            const snapshot = await database.ref('users/' + user.uid).once('value');
                            const userData = snapshot.val();
                            if (userData && (userData.role === 'volunteer' || userData.role === 'admin')) {
                                currentVolunteerId = user.uid;
                                currentVolunteerName = userData.name || user.email.split('@')[0];
                                localStorage.setItem('userId', user.uid);
                                localStorage.setItem('userName', currentVolunteerName);
                                localStorage.setItem('userRole', userData.role);
                                resolve();
                            } else {
                                window.location.href = 'login.html';
                                resolve();
                            }
                        } else {
                            window.location.href = 'login.html';
                            resolve();
                        }
                    });
                }
            });
        }

        // ==================== UPDATE USER POINTS ====================
        async function updateUserPoints(pointsToAdd) {
            if (!currentVolunteerId) return false;
            
            try {
                const userRef = database.ref('users/' + currentVolunteerId);
                const snapshot = await userRef.once('value');
                let userData = snapshot.val();
                
                if (!userData) {
                    userData = { name: currentVolunteerName, points: 0, stats: { requestsAccepted: 0 } };
                }
                if (!userData.stats) userData.stats = { requestsAccepted: 0 };
                
                const currentPoints = userData.points || 0;
                userData.stats.requestsAccepted = (userData.stats.requestsAccepted || 0) + 1;
                
                await userRef.update({
                    points: currentPoints + pointsToAdd,
                    stats: userData.stats,
                    lastUpdated: new Date().toISOString()
                });
                
                showPointsToast(`+${pointsToAdd} পয়েন্ট! (রিকোয়েস্ট একসেপ্ট)`);
                return true;
            } catch (error) {
                console.error("Points error:", error);
                return false;
            }
        }

        function showPointsToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'points-toast';
            toast.innerHTML = `🎉 ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function showToastMessage(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = type === 'error' ? '#dc2626' : 'var(--accent)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ==================== LOAD REQUESTS (REAL-TIME) ====================
        function loadAllRequests() {
            if (allRequestsListener) allRequestsListener.off();
            
            allRequestsListener = database.ref('bloodRequests').on('value', (snapshot) => {
                allRequests = [];
                snapshot.forEach((childSnapshot) => {
                    const req = childSnapshot.val();
                    req.id = childSnapshot.key;
                    allRequests.push(req);
                });
                allRequests.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                displayRequests();
                updateBadges();
                updateBottomBadge();
            });
        }

        function updateBadges() {
            document.getElementById('badgeAll').textContent = allRequests.length;
            document.getElementById('badgePending').textContent = allRequests.filter(r => r.status === 'pending').length;
            document.getElementById('badgeAccepted').textContent = allRequests.filter(r => r.status === 'accepted').length;
            document.getElementById('badgeCompleted').textContent = allRequests.filter(r => r.status === 'completed').length;
        }

        function updateBottomBadge() {
            const pendingCount = allRequests.filter(r => r.status === 'pending').length;
            const badge = document.getElementById('bottomRequestBadge');
            if (badge) {
                badge.textContent = pendingCount;
                badge.style.display = pendingCount > 0 ? 'inline-flex' : 'none';
            }
        }

        function getFilteredRequests() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const bloodFilter = document.getElementById('bloodFilter').value;
            const urgencyFilter = document.getElementById('urgencyFilter').value;
            const districtFilter = document.getElementById('districtFilter').value;
            
            return allRequests.filter(req => {
                if (currentTab !== 'all' && req.status !== currentTab) return false;
                if (searchText && !req.patientName?.toLowerCase().includes(searchText) && 
                    !req.hospitalName?.toLowerCase().includes(searchText) && 
                    !req.district?.toLowerCase().includes(searchText)) return false;
                if (bloodFilter && req.bloodGroup !== bloodFilter) return false;
                if (urgencyFilter && req.urgency !== urgencyFilter) return false;
                if (districtFilter && req.district !== districtFilter) return false;
                return true;
            });
        }

        function displayRequests() {
            const requests = getFilteredRequests();
            const list = document.getElementById('requestList');
            document.getElementById('countValue').textContent = requests.length;
            
            if (requests.length === 0) {
                list.innerHTML = `<div class="empty-placeholder">
                    <i class="fas fa-inbox"></i>
                    <h3>কোন রিকোয়েস্ট খুঁজে পাওয়া যায়নি</h3>
                </div>`;
                return;
            }
            
            list.innerHTML = requests.map(req => {
                const isPending = req.status === 'pending';
                const isAccepted = req.status === 'accepted';
                const isCompleted = req.status === 'completed';
                const isRejected = req.status === 'rejected';
                
                const statusLabels = { pending: 'পেন্ডিং', accepted: 'অ্যাকসেপ্টেড', rejected: 'রিজেক্টেড', completed: 'কমপ্লিট' };
                const statusClasses = { pending: 'status-pending', accepted: 'status-accepted', rejected: 'status-rejected', completed: 'status-completed' };
                
                const urgencyLabels = { critical: 'ক্রিটিকাল', high: 'হাই', medium: 'মিডিয়াম', low: 'লো' };
                const urgencyClasses = { critical: 'critical', high: 'high', medium: 'medium', low: 'low' };
                const urgencyIcons = { critical: '🔥', high: '⚠️', medium: '📌', low: '✅' };
                
                const urgency = req.urgency || 'medium';
                const showUrgencyBadge = isPending && (urgency === 'critical' || urgency === 'high');
                
                let actionButtons = '';
                if (isPending) {
                    actionButtons = `
                        <button class="btn btn-accept" onclick="acceptRequest('${req.id}')">
                            <i class="fas fa-check"></i> একসেপ্ট
                        </button>
                        <button class="btn btn-reject" onclick="openRejectModal('${req.id}')">
                            <i class="fas fa-times"></i> রিজেক্ট
                        </button>
                    `;
                } else if (isAccepted) {
                    actionButtons = `
                        <a href="tel:${req.requesterPhone}" class="btn btn-call" style="text-decoration:none;">
                            <i class="fas fa-phone"></i> কল
                        </a>
                        <button class="btn btn-chat" onclick="openChatWithRequester('${req.userId}', '${escapeHtml(req.requesterName)}', '${req.id}')">
                            <i class="fas fa-comment"></i> চ্যাট
                        </button>
                        <button class="btn btn-complete" onclick="openCompleteModal('${req.id}')">
                            <i class="fas fa-check-double"></i> কমপ্লিট
                        </button>
                    `;
                }
                
                return `
                <div class="request-card ${showUrgencyBadge ? 'urgent' : ''}">
                    ${showUrgencyBadge ? `
                        <div class="urgency-badge ${urgencyClasses[urgency]}">
                            ${urgencyIcons[urgency]} ${urgencyLabels[urgency]}
                        </div>
                    ` : ''}
                    <div class="request-card-inner">
                        <div class="request-top">
                            <div class="blood-group-badge">${req.bloodGroup}</div>
                            <div class="request-info">
                                <div class="patient-name">${escapeHtml(req.patientName)}</div>
                                <div class="patient-problem">
                                    <i class="fas fa-stethoscope"></i>
                                    ${escapeHtml(req.patientProblem || 'উল্লেখ নেই')}
                                </div>
                                <div class="request-meta">
                                    <span><i class="fas fa-tint"></i> ${req.bagsNeeded || 1} ব্যাগ</span>
                                    <span><i class="fas fa-clock"></i> ${getTimeAgo(req.createdAt)}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="request-details-grid">
                            <div class="detail-item"><i class="fas fa-map-marker-alt"></i> ${req.district}, ${req.upazila || ''}</div>
                            <div class="detail-item"><i class="fas fa-hospital"></i> ${escapeHtml(req.hospitalName)}</div>
                            <div class="detail-item"><i class="fas fa-user"></i> ${escapeHtml(req.requesterName)}</div>
                            <div class="detail-item"><i class="fas fa-phone"></i> ${req.requesterPhone}</div>
                        </div>
                        
                        ${isRejected && req.rejectReason ? `
                            <div class="reject-reason">
                                <i class="fas fa-ban"></i> কারণ: ${escapeHtml(req.rejectReason)}
                            </div>
                        ` : ''}
                        
                        ${isCompleted && req.donorInfo ? `
                            <div class="donor-info">
                                <i class="fas fa-user-check"></i>
                                <strong>ডোনার:</strong> ${escapeHtml(req.donorInfo.name)} (${req.donorInfo.phone})
                                ${req.donorInfo.date ? `<span><i class="fas fa-calendar"></i> ${req.donorInfo.date}</span>` : ''}
                            </div>
                        ` : ''}
                        
                        <div class="request-bottom">
                            <span class="status-badge ${statusClasses[req.status]}">
                                ${statusLabels[req.status]}
                            </span>
                            <div class="action-buttons">
                                ${actionButtons}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // ==================== HELPER FUNCTIONS ====================
        function getTimeAgo(timestamp) {
            if (!timestamp) return 'এখন';
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'এখনই';
            if (diffMins < 60) return `${diffMins} মিনিট আগে`;
            if (diffHours < 24) return `${diffHours} ঘন্টা আগে`;
            return `${diffDays} দিন আগে`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== TAB & FILTER ====================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-switch-btn').forEach((btn, i) => {
                const isActive = (tab === 'all' && i === 0) || (tab === 'pending' && i === 1) || 
                                 (tab === 'accepted' && i === 2) || (tab === 'completed' && i === 3);
                btn.classList.toggle('active', isActive);
            });
            displayRequests();
        }
        
        function filterRequests() { displayRequests(); }

        // ==================== ACCEPT REQUEST ====================
        async function acceptRequest(id) {
            const req = allRequests.find(r => r.id === id);
            if (!req || req.status !== 'pending') return;
            
            try {
                await getCurrentVolunteer();
                await updateUserPoints(3);
                
                await database.ref('bloodRequests/' + id).update({
                    status: 'accepted',
                    acceptedBy: currentVolunteerId,
                    acceptedByName: currentVolunteerName,
                    updatedAt: new Date().toISOString()
                });
                
                document.getElementById('feedbackContent').innerHTML = `
                    <p style="color:var(--accent); font-weight:600; margin-bottom:12px;">
                        <i class="fas fa-check-circle"></i> রিকোয়েস্ট অ্যাকসেপ্ট করা হয়েছে
                    </p>
                    <p style="margin-bottom:8px;">🎉 +3 পয়েন্ট যোগ হয়েছে!</p>
                    <p style="margin-bottom:12px;">📞 ${escapeHtml(req.requesterName)} এর নম্বর: <strong>${req.requesterPhone}</strong></p>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <a href="tel:${req.requesterPhone}" class="btn btn-call" style="text-decoration:none; display:inline-flex;">
                            <i class="fas fa-phone"></i> কল করুন
                        </a>
                        <button class="btn btn-chat" onclick="closeFeedbackModal(); openChatWithRequester('${req.userId}', '${escapeHtml(req.requesterName)}', '${req.id}')">
                            <i class="fas fa-comment"></i> চ্যাট করুন
                        </button>
                    </div>
                `;
                document.getElementById('feedbackModal').classList.add('active');
                showToastMessage('✅ রিকোয়েস্ট অ্যাকসেপ্ট করা হয়েছে! +3 পয়েন্ট');
            } catch (error) {
                console.error("Accept error:", error);
                showToastMessage('একসেপ্ট করতে সমস্যা হয়েছে!', 'error');
            }
        }

        function closeFeedbackModal() { document.getElementById('feedbackModal').classList.remove('active'); }
        
        function openRejectModal(id) { rejectTargetId = id; document.getElementById('rejectReason').value = ''; document.getElementById('rejectModal').classList.add('active'); }
        function closeRejectModal() { document.getElementById('rejectModal').classList.remove('active'); rejectTargetId = null; }
        
        async function confirmReject() {
            if (!rejectTargetId) return;
            try {
                await database.ref('bloodRequests/' + rejectTargetId).update({
                    status: 'rejected',
                    rejectReason: document.getElementById('rejectReason').value.trim() || 'কারণ উল্লেখ করা হয়নি',
                    updatedAt: new Date().toISOString()
                });
                closeRejectModal();
                showToastMessage('❌ রিকোয়েস্ট রিজেক্ট করা হয়েছে');
            } catch (error) { showToastMessage('রিজেক্ট করতে সমস্যা হয়েছে!', 'error'); }
        }
        
        function openCompleteModal(id) { completeTargetId = id; document.getElementById('donorName').value = ''; document.getElementById('donorPhone').value = ''; document.getElementById('donorDate').value = ''; document.getElementById('completeModal').classList.add('active'); }
        function closeCompleteModal() { document.getElementById('completeModal').classList.remove('active'); completeTargetId = null; }
        
        async function markCompleted() {
            if (!completeTargetId) return;
            const req = allRequests.find(r => r.id === completeTargetId);
            if (!req || req.status !== 'accepted') return;
            
            const name = document.getElementById('donorName').value.trim();
            const phone = document.getElementById('donorPhone').value.trim();
            if (!name || !phone) { showToastMessage('⚠️ ডোনারের নাম ও ফোন আবশ্যক'); return; }
            
            try {
                await database.ref('bloodRequests/' + completeTargetId).update({
                    status: 'completed',
                    donorInfo: { name, phone, date: document.getElementById('donorDate').value || new Date().toLocaleDateString('bn-BD') },
                    updatedAt: new Date().toISOString()
                });
                closeCompleteModal();
                showToastMessage('✅ ডোনেশন কমপ্লিট হিসেবে চিহ্নিত করা হয়েছে');
            } catch (error) { showToastMessage('কমপ্লিট মার্ক করতে সমস্যা হয়েছে!', 'error'); }
        }

        function openChatWithRequester(userId, userName, requestId) {
            localStorage.setItem('chatWithUserId', userId);
            localStorage.setItem('chatWithUserName', userName);
            localStorage.setItem('chatRequestId', requestId);
            window.location.href = 'chat.html';
        }

        // ==================== LOAD UNREAD COUNTS ====================
        async function loadUnreadCounts() {
            if (!currentVolunteerId) return;
            try {
                const snapshot = await database.ref('chatRooms').once('value');
                let chatUnread = 0;
                snapshot.forEach(child => {
                    const room = child.val();
                    if (room.participants && room.participants[currentVolunteerId]) {
                        chatUnread += room.unreadCount?.[currentVolunteerId] || 0;
                    }
                });
                const chatBadge = document.getElementById('bottomChatBadge');
                if (chatBadge) {
                    chatBadge.textContent = chatUnread;
                    chatBadge.style.display = chatUnread > 0 ? 'inline-flex' : 'none';
                }
            } catch (error) { console.error("Error loading unread counts:", error); }
        }

        // ==================== SIDEBAR & THEME ====================
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const themeToggleSidebar = document.getElementById('themeToggleSidebar');
        const logoutBtn = document.getElementById('logoutBtn');

        function toggleSidebar() {
            if (sidebar && overlay) {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        async function logout() {
            try {
                if (currentVolunteerId) {
                    await database.ref('users/' + currentVolunteerId).update({
                        online: false,
                        lastSeen: Date.now()
                    });
                }
                await auth.signOut();
                localStorage.clear();
                window.location.href = 'login.html';
            } catch (error) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
        if (overlay) overlay.addEventListener('click', toggleSidebar);
        if (themeToggleSidebar) themeToggleSidebar.addEventListener('click', toggleTheme);
        if (logoutBtn) logoutBtn.addEventListener('click', logout);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && sidebar?.classList.contains('open')) {
                toggleSidebar();
            }
        });

        // Make functions global
        window.switchTab = switchTab;
        window.filterRequests = filterRequests;
        window.loadAllRequests = loadAllRequests;
        window.acceptRequest = acceptRequest;
        window.openRejectModal = openRejectModal;
        window.closeRejectModal = closeRejectModal;
        window.confirmReject = confirmReject;
        window.closeFeedbackModal = closeFeedbackModal;
        window.openCompleteModal = openCompleteModal;
        window.closeCompleteModal = closeCompleteModal;
        window.markCompleted = markCompleted;
        window.openChatWithRequester = openChatWithRequester;

        // ==================== INITIALIZE ====================
        initTheme();
        getCurrentVolunteer().then(() => {
            loadAllRequests();
            loadUnreadCounts();
        });
    </script>
</body>
</html>
