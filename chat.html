<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>চ্যাট - Volunteer Flow</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    
    <style>
        /* Chat Page Specific Styles - Matching Other Pages */
        .chat-page {
            padding: 0;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }

        .header-inner {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--accent) 0%, #4ade80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .header-icon:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.05);
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Back Button for Conversation */
        .conv-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-weight: 500;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .conv-back-btn:hover {
            color: var(--accent);
            background: var(--card-hover);
            transform: translateX(-3px);
        }

        /* Tab Switch - Card Style like Request Page */
        .tab-switch {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .tab-switch-btn {
            flex: 1;
            padding: 10px 8px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: 'Hind Siliguri', sans-serif;
            background: transparent;
            color: var(--muted);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-switch-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 10px var(--glow);
        }

        .tab-switch-btn .badge {
            background: rgba(255,255,255,0.3);
            color: white;
            font-size: 10px;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .tab-switch-btn:not(.active) .badge {
            background: var(--accent);
            color: white;
        }

        /* Search Card */
        .search-card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px var(--shadow);
        }

        .search-box {
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg);
            color: var(--fg);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        /* Chat List */
        .chat-list, .volunteer-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Chat Item Card - Like Activity Card */
        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: var(--card);
            border-radius: 18px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            /* FIX: মোবাইলে long-press করলে ব্রাউজারের নিজস্ব callout/text-selection মেনু
               কাস্টম কনটেক্সট-মেনুর সাথে সংঘর্ষ করে, ফলে "চ্যাট ডিলিট" মেনু ঠিকভাবে খোলে না —
               তাই টাচ-কলআউট ও সিলেকশন বন্ধ করা হলো */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            touch-action: pan-y;
        }

        .chat-item:hover {
            transform: translateX(5px);
            border-color: var(--accent);
            box-shadow: 0 4px 15px var(--glow);
        }

        .chat-avatar {
            position: relative;
            flex-shrink: 0;
        }

        .chat-avatar i {
            font-size: 48px;
            color: var(--accent);
        }

        .chat-avatar img,
        .volunteer-avatar img,
        .conv-user-avatar img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            display: block;
        }

        .conv-user-avatar img {
            width: 44px;
            height: 44px;
        }

        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid var(--card);
        }

        .offline-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: var(--muted);
            border-radius: 50%;
            border: 2px solid var(--card);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .chat-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--fg);
        }

        .chat-role {
            font-size: 10px;
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .chat-time {
            font-size: 11px;
            color: var(--muted);
        }

        .chat-last-msg {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--accent);
            color: white;
            font-size: 11px;
            font-weight: 700;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        /* Volunteer Card */
        .volunteer-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: var(--card);
            border-radius: 18px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .volunteer-card:hover {
            transform: translateX(5px);
            border-color: var(--accent);
            box-shadow: 0 4px 15px var(--glow);
        }

        .volunteer-avatar i {
            font-size: 48px;
            color: var(--accent);
        }

        .volunteer-info {
            flex: 1;
        }

        .volunteer-name-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }

        .volunteer-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--fg);
        }

        .volunteer-role {
            font-size: 10px;
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .volunteer-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11.5px;
            color: var(--muted);
        }

        .volunteer-details span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volunteer-details i {
            width: 14px;
            color: var(--accent);
        }

        .msg-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .msg-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px var(--glow);
        }

        /* Conversation Page */
        .conversation-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 200;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .conversation-page.active {
            transform: translateX(0);
        }

        /* Conversation Header */
        .conv-header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .conv-back {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .conv-back:hover {
            background: var(--accent);
            color: white;
        }

        .conv-user {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .conv-user-avatar i {
            font-size: 44px;
            color: var(--accent);
        }

        .conv-user-info {
            flex: 1;
            min-width: 0;
        }

        .conv-user-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-user-status {
            font-size: 11.5px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-user-status.online {
            color: #10b981;
        }

        /* NEW: হেডারে নাম এখন একাই দেখানো হয় (ডেজিগনেশন আলাদা ছোট ব্যাজে) — যাতে বড় নাম যতটা সম্ভব দেখা যায় */
        .conv-user-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .conv-user-designation {
            flex-shrink: 0;
            font-size: 10px;
            color: var(--muted);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 1px 7px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .conv-user-meta .conv-user-status {
            min-width: 0;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Date Divider */
        .date-divider {
            text-align: center;
            margin: 16px 0;
        }

        .date-divider span {
            background: var(--bg-secondary);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        /* Message Row */
        .message-row {
            display: flex;
            margin-bottom: 8px;
            /* FIX: একই কারণে মেসেজ-বাবলেও long-press করলে নেটিভ টেক্সট-সিলেকশন/callout
               মেনু চলে আসতো এবং Edit/Delete for me/Delete for everyone কাস্টম মেনু খুলতো না
               বা মাঝপথে বাতিল হয়ে যেত — তাই এখানেও বন্ধ করা হলো */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            touch-action: pan-y;
        }

        .message-row.sent {
            justify-content: flex-end;
        }

        .message-row.received {
            justify-content: flex-start;
        }

        /* Message Bubble */
        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 14px;
            word-break: break-word;
            position: relative;
        }

        .message-row.sent .message-bubble {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row.received .message-bubble {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--fg);
            border-bottom-left-radius: 4px;
        }

        /* Message Footer (Time + Status) */
        .message-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 4px;
            font-size: 10px;
        }

        .message-row.sent .message-footer {
            justify-content: flex-end;
        }

        .message-row.received .message-footer {
            justify-content: flex-start;
        }

        .message-time {
            color: var(--muted);
        }

        .message-status {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .message-status i {
            font-size: 10px;
        }

        .message-status.delivered i { color: #10b981; }
        .message-status.read i { color: #3b82f6; }
        .message-status.sent i { color: var(--muted); }

        /* Message Actions (Edit/Delete) */
        .message-actions {
            display: none;
            position: absolute;
            top: -25px;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 8px;
            gap: 12px;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .message-row.sent:hover .message-actions {
            display: flex;
        }

        .message-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-size: 12px;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .message-actions button:hover {
            color: var(--accent);
        }

        .message-actions .delete-btn:hover {
            color: var(--danger);
        }

        /* Edit Message Input */
        .edit-message-input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--accent);
            border-radius: 16px;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg);
            color: var(--fg);
        }

        .edited-badge {
            font-size: 9px;
            opacity: 0.7;
            margin-left: 6px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--muted);
            border-radius: 50%;
            animation: typingAnim 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnim {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Message Input Area */
        .message-input-area {
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 10px 14px max(10px, env(safe-area-inset-bottom));
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 380px) {
            .input-wrapper {
                gap: 6px;
            }
            .message-input {
                padding: 10px 14px;
                font-size: 13.5px;
            }
        }

        .message-input {
            flex: 1;
            min-width: 0;
            padding: 11px 16px;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 14px;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        /* Chat Item Long-Press Delete Menu */
        .chat-item.long-pressing {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .chat-context-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 300;
            display: none;
        }

        .chat-context-overlay.active {
            display: block;
        }

        .chat-context-menu {
            position: fixed;
            z-index: 301;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 8px 30px var(--shadow);
            overflow: hidden;
            min-width: 200px;
            display: none;
        }

        .chat-context-menu.active {
            display: block;
        }

        .chat-context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .chat-context-menu-item:hover {
            background: var(--bg-secondary);
        }

        .chat-context-menu-item.danger {
            color: var(--danger);
        }

        /* Loading & Empty States */
        .loading-placeholder, .empty-placeholder {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .loading-placeholder i, .empty-placeholder i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            opacity: 0.4;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent, var(--bg) 20%);
            padding-top: 20px;
            z-index: 100;
        }

        .bottom-nav-inner {
            display: flex;
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            box-shadow: 0 -4px 15px var(--shadow);
        }

        .bottom-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            position: relative;
        }

        .bottom-tab.active {
            color: var(--accent);
        }

        .bottom-tab i {
            font-size: 1.3rem;
        }

        .bottom-tab span {
            font-size: 0.7rem;
        }

        .bottom-tab .badge {
            position: absolute;
            top: 0;
            right: calc(50% - 20px);
            background: var(--danger);
            color: white;
            font-size: 0.6rem;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ==================== CALL BUTTONS (Header) ==================== */
        .conv-call-actions {
            display: flex;
            gap: 8px;
        }

        .call-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .call-action-btn:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.05);
        }

        /* ==================== ATTACH / MIC BUTTONS ==================== */
        .attach-btn, .mic-btn {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            cursor: pointer;
            color: var(--accent);
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .attach-btn:hover, .mic-btn:hover {
            background: var(--accent);
            color: white;
        }

        .mic-btn.recording-active {
            background: var(--danger);
            color: white;
        }

        /* ==================== RECORDING BAR ==================== */
        .recording-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .recording-bar.active {
            display: flex;
        }

        .recording-cancel-btn, .recording-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .recording-cancel-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--danger);
        }

        .recording-send-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
        }

        .recording-indicator {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
        }

        .recording-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--danger);
            animation: recordPulse 1s infinite;
        }

        @keyframes recordPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ==================== IMAGE / AUDIO MESSAGE BUBBLES ==================== */
        .msg-image {
            max-width: 100%;
            width: 220px;
            border-radius: 14px;
            cursor: pointer;
            display: block;
        }

        .message-row.sent .message-bubble:has(.msg-image),
        .message-row.received .message-bubble:has(.msg-image),
        .message-row.sent .message-bubble:has(.voice-msg),
        .message-row.received .message-bubble:has(.voice-msg) {
            padding: 6px;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        /* ==================== VOICE MESSAGE (custom player) ==================== */
        .voice-msg {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 18px;
            min-width: 190px;
            max-width: 260px;
        }

        .voice-msg audio {
            display: none;
        }

        .message-row.sent .voice-msg {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message-row.received .voice-msg {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--fg);
            border-bottom-left-radius: 6px;
        }

        .voice-msg-play-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: transform 0.2s ease;
        }

        .voice-msg-play-btn:hover {
            transform: scale(1.08);
        }

        .message-row.sent .voice-msg-play-btn {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        .message-row.received .voice-msg-play-btn {
            background: var(--accent);
            color: white;
        }

        .voice-msg-track {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .message-row.sent .voice-msg-track {
            background: rgba(255,255,255,0.35);
        }

        .message-row.received .voice-msg-track {
            background: var(--border);
        }

        .voice-msg-progress {
            height: 100%;
            width: 0%;
            border-radius: 2px;
        }

        .message-row.sent .voice-msg-progress {
            background: #ffffff;
        }

        .message-row.received .voice-msg-progress {
            background: var(--accent);
        }

        .voice-msg-time {
            font-size: 10.5px;
            flex-shrink: 0;
            opacity: 0.9;
            min-width: 30px;
            text-align: right;
        }

        /* ==================== CALL LOG DIVIDER ==================== */
        .call-log-divider span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .call-log-divider.missed span {
            color: var(--danger);
            border-color: var(--danger);
        }

        /* ==================== CALL OVERLAYS (Outgoing / Incoming) ==================== */
        .call-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 500;
            background: linear-gradient(160deg, var(--accent-dark) 0%, #0f172a 100%);
            align-items: center;
            justify-content: center;
        }

        .call-overlay.active {
            display: flex;
        }

        .call-overlay-inner {
            text-align: center;
            color: white;
            padding: 24px;
        }

        .call-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: callAvatarPulse 1.6s infinite;
        }

        .call-avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .call-avatar-large i {
            font-size: 64px;
            color: white;
        }

        @keyframes callAvatarPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25); }
            50% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
        }

        .call-user-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .call-status-text {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .call-end-btn, .call-decline-btn, .call-accept-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .call-end-btn, .call-decline-btn {
            background: var(--danger);
            color: white;
        }

        .call-accept-btn {
            background: #10b981;
            color: white;
            animation: callAcceptPulse 1.2s infinite;
        }

        @keyframes callAcceptPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .call-end-btn:hover, .call-decline-btn:hover, .call-accept-btn:hover {
            transform: scale(1.08);
        }

        .incoming-call-actions {
            display: flex;
            gap: 40px;
            justify-content: center;
        }

        /* NEW: কল overlay মিনিমাইজ বাটন */
        .call-minimize-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .call-minimize-btn:hover {
            background: rgba(255,255,255,0.28);
        }

        /* NEW: মিনিমাইজ করা কলের ফ্লোটিং বাবল (Messenger/WhatsApp স্টাইল) */
        .call-bubble {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, var(--accent-dark));
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            z-index: 550;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: callBubblePulse 1.6s infinite;
        }

        .call-bubble.active {
            display: flex;
        }

        .call-bubble-avatar i {
            font-size: 24px;
            color: white;
        }

        @keyframes callBubblePulse {
            0%, 100% { box-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 0 0 rgba(16,185,129,0.5); }
            50% { box-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 0 10px rgba(16,185,129,0); }
        }

        /* ==================== NEW: LIVE WEBRTC CALL SCREEN ==================== */
        .live-call-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 650;
            background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
            flex-direction: column;
        }

        .live-call-screen.active {
            display: flex;
        }

        .remote-video {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .live-call-audio-avatar {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: center;
        }

        .live-call-audio-avatar i {
            font-size: 130px;
            color: rgba(255,255,255,0.85);
        }

        /* NEW: অডিও কলে আসল প্রোফাইল ফটো দেখানোর জন্য */
        .live-call-audio-avatar-photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 0 6px rgba(255,255,255,0.08);
            animation: callAvatarPulse 1.6s infinite;
        }

        .live-call-audio-avatar-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* NEW: লাউডস্পিকার অন/অফ বাটন — মাইক/ক্যামেরা বাটনের মতোই স্টাইল, off হলে হাইলাইট হবে */
        .lc-control-btn.speaker.off {
            background: rgba(255,255,255,0.85);
            color: #111;
        }

        .local-video-pip {
            display: none;
            position: absolute;
            top: 70px;
            right: 16px;
            width: 100px;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.4);
            z-index: 2;
            background: #111;
        }

        .live-call-top-bar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
        }

        .live-call-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .live-call-name {
            color: white;
            font-weight: 700;
            font-size: 17px;
        }

        .live-call-timer {
            color: rgba(255,255,255,0.75);
            font-size: 12.5px;
        }

        .live-call-controls {
            position: relative;
            z-index: 2;
            margin-top: auto;
            display: flex;
            justify-content: center;
            gap: 26px;
            padding: 26px 20px 40px;
        }

        .lc-control-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.18);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .lc-control-btn.off {
            background: rgba(255,255,255,0.85);
            color: #111;
        }

        .lc-control-btn.end {
            background: #ef4444;
        }

        .lc-control-btn:hover {
            filter: brightness(1.1);
        }

        /* ==================== IMAGE VIEWER LIGHTBOX ==================== */
        .image-viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 600;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-viewer.active {
            display: flex;
        }

        .image-viewer img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        /* NEW: ছবি ভিউয়ারে ডাউনলোড/ক্লোজ অ্যাকশন বাটন */
        .image-viewer-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 601;
        }

        .iv-action-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .iv-action-btn:hover {
            background: rgba(255,255,255,0.28);
        }

        @media (max-width: 480px) {
            .volunteer-card {
                flex-wrap: wrap;
            }
            .volunteer-info {
                min-width: 0;
                flex-basis: calc(100% - 62px);
            }
            .volunteer-details {
                flex-direction: column;
                gap: 4px;
            }
            .msg-btn {
                flex: 1 0 100%;
                margin-top: 10px;
                padding: 10px 16px;
                font-size: 12px;
            }
            .chat-name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">Volunteer Flow</div>
            <div class="header-actions">
                <button class="header-icon" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="chat-page">
            <!-- Tab Switch -->
            <div class="tab-switch">
                <button class="tab-switch-btn active" data-tab="chat">
                    <i class="fas fa-comment-dots"></i> চ্যাট
                    <span class="badge" id="chatTabBadge">0</span>
                </button>
                <button class="tab-switch-btn" data-tab="volunteers">
                    <i class="fas fa-users"></i> ভলান্টিয়ার
                </button>
            </div>

            <!-- Search Card -->
            <div class="search-card">
                <div class="search-box">
                    <i class="fas fa-search" style="position: absolute; margin-left: 12px; margin-top: 14px; color: var(--muted);"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="নাম বা মেসেজ সার্চ করুন..." style="padding-left: 40px;">
                </div>
            </div>

            <!-- Chat Tab Content -->
            <div id="chatTabContent" class="tab-content active">
                <div class="chat-list" id="chatList">
                    <div class="loading-placeholder">
                        <i class="fas fa-spinner fa-pulse"></i>
                        চ্যাট লোড হচ্ছে...
                    </div>
                </div>
            </div>

            <!-- Volunteers Tab Content -->
            <div id="volunteersTabContent" class="tab-content" style="display: none;">
                <div class="volunteer-list" id="volunteerList">
                    <div class="loading-placeholder">
                        <i class="fas fa-spinner fa-pulse"></i>
                        ভলান্টিয়ার লোড হচ্ছে...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Chat Item Long-Press Context Menu (Messenger-style) -->
    <div class="chat-context-overlay" id="chatContextOverlay"></div>
    <div class="chat-context-menu" id="chatContextMenu">
        <div class="chat-context-menu-item danger" id="chatContextDeleteBtn">
            <i class="fas fa-trash-alt"></i> চ্যাট ডিলিট করুন
        </div>
    </div>

    <!-- Message Long-Press Context Menu -->
    <div class="chat-context-overlay" id="msgContextOverlay"></div>
    <div class="chat-context-menu" id="msgContextMenu">
        <div class="chat-context-menu-item" id="msgEditBtn">
            <i class="fas fa-edit"></i> এডিট করুন
        </div>
        <!-- NEW: "ডিলিট ফর মি" — যেকোনো মেসেজে (নিজের/অন্যের) দেখানো হয়, শুধু নিজের ভিউ থেকে সরায় -->
        <div class="chat-context-menu-item" id="msgDeleteForMeBtn">
            <i class="fas fa-trash-alt"></i> ডিলিট ফর মি
        </div>
        <!-- NEW: "ডিলিট ফর এভরিওয়ান" — শুধু নিজের পাঠানো মেসেজে দেখানো হয় -->
        <div class="chat-context-menu-item danger" id="msgDeleteForEveryoneBtn">
            <i class="fas fa-trash-alt"></i> ডিলিট ফর এভরিওয়ান
        </div>
        <div class="chat-context-menu-item" id="msgCancelBtn">
            <i class="fas fa-times"></i> বাতিল
        </div>
    </div>

    <!-- NEW FIX #1: Call overlay markup আগে মূল জাভাস্ক্রিপ্ট ব্লকের পরে বসানো ছিল, তাই getElementById() null পেত এবং
         Accept/Decline/Cancel বাটনে কখনো click listener বসতোই না। এখানে জাভাস্ক্রিপ্ট ব্লকের আগে সরিয়ে আনা হলো। -->
    <!-- Outgoing Call Overlay -->
    <div class="call-overlay" id="outgoingCallOverlay">
        <div class="call-overlay-inner">
            <button class="call-minimize-btn" id="minimizeOutgoingCallBtn" title="মিনিমাইজ করুন">
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="call-avatar-large" id="outgoingCallAvatar"><i class="fas fa-user-circle"></i></div>
            <div class="call-user-name" id="outgoingCallName"></div>
            <div class="call-status-text" id="outgoingCallStatusText">রিং হচ্ছে...</div>
            <button class="call-end-btn" id="cancelOutgoingCallBtn" title="কল কাটুন">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <!-- Incoming Call Popup -->
    <div class="call-overlay" id="incomingCallOverlay">
        <div class="call-overlay-inner">
            <button class="call-minimize-btn" id="minimizeIncomingCallBtn" title="মিনিমাইজ করুন">
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="call-avatar-large" id="incomingCallAvatar"><i class="fas fa-user-circle"></i></div>
            <div class="call-user-name" id="incomingCallName"></div>
            <div class="call-status-text" id="incomingCallTypeText">ইনকামিং কল...</div>
            <div class="incoming-call-actions">
                <button class="call-decline-btn" id="declineCallBtn" title="প্রত্যাখ্যান">
                    <i class="fas fa-phone-slash"></i>
                </button>
                <button class="call-accept-btn" id="acceptCallBtn" title="গ্রহণ করুন">
                    <i class="fas fa-phone"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- NEW: মিনিমাইজ করা কলের ফ্লোটিং বাবল (Messenger/WhatsApp স্টাইল) -->
    <div class="call-bubble" id="callBubble" onclick="expandCall()" title="কলে ফিরে যেতে ট্যাপ করুন">
        <div class="call-bubble-avatar"><i class="fas fa-phone-volume"></i></div>
    </div>

    <!-- NEW: লাইভ WebRTC কল স্ক্রিন (Jitsi-এর বদলে নিজস্ব ইন-অ্যাপ কল UI) -->
    <div class="live-call-screen" id="liveCallScreen">
        <video id="remoteVideoEl" class="remote-video" autoplay playsinline></video>
        <div class="live-call-audio-avatar" id="liveCallAudioAvatar"><i class="fas fa-user-circle"></i></div>
        <video id="localVideoEl" class="local-video-pip" autoplay playsinline muted></video>
        <div class="live-call-top-bar">
            <button class="call-minimize-btn" id="minimizeLiveCallBtn" title="মিনিমাইজ করুন">
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="live-call-info">
                <div class="live-call-name" id="liveCallName"></div>
                <div class="live-call-timer" id="liveCallTimer">00:00</div>
            </div>
        </div>
        <div class="live-call-controls">
            <button class="lc-control-btn" id="toggleMicBtn" title="মাইক অন/অফ">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="lc-control-btn" id="toggleCamBtn" title="ক্যামেরা অন/অফ">
                <i class="fas fa-video"></i>
            </button>
            <button class="lc-control-btn speaker" id="toggleSpeakerBtn" title="লাউডস্পিকার অন/অফ">
                <i class="fas fa-volume-up"></i>
            </button>
            <button class="lc-control-btn end" id="endLiveCallBtn" title="কল শেষ করুন">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

                    online: true,

                });

                    online: false,
                    lastSeen: Date.now()

                    const user = child.val();
                    const uid = child.key;

                        allOtherVolunteers.push({
                            uid: uid,
                            name: user.name || 'ভলান্টিয়ার',
                            online: user.online || false,
                            lastSeen: user.lastSeen || 0,
                            avatarUrl: user.avatarUrl || '',
                            designation: user.designation || (user.role === 'admin' ? 'এডমিন' : 'ভলান্টিয়ার'),
                            address: user.district || 'বাংলাদেশ',
                            phone: user.phone || 'N/A',
                            bloodGroup: user.bloodGroup || 'N/A',
                            role: user.role || 'volunteer'
                        });
                    }
                });
                
                console.log("✅ Other volunteers found:", allOtherVolunteers.length);
                renderVolunteerList();
            } catch (error) {
                console.error("Error loading volunteers:", error);
            }

        // ==================== LOAD CHAT ROOMS ====================
        async function loadChatRooms() {
            if (!currentUserId) return;
            
            try {
                const snapshot = await database.ref('chatRooms').once('value');
                const allRooms = snapshot.val();
                
                if (!allRooms) {
                    allChatRooms = [];
                    renderChatList();
                    return;
                }
                
                const roomsWithUser = [];
                
                for (const [roomId, room] of Object.entries(allRooms)) {
                    let isParticipant = false;
                    let otherUserId = null;
                    
                    if (room.participants) {
                        for (const [uid] of Object.entries(room.participants)) {
                            if (uid === currentUserId) {
                                isParticipant = true;
                            } else {
                                otherUserId = uid;
                            }
                        }
                    }
                    
                    if (isParticipant && otherUserId) {
                        const userSnap = await database.ref('users/' + otherUserId).once('value');
                        const userData = userSnap.val();
                        const otherRole = userData?.role;
                        const otherName = userData?.name || (otherRole === 'user' ? 'ইউজার' : 'ভলান্টিয়ার');
                        
                        if (room.deletedFor && room.deletedFor[currentUserId]) continue;

                        roomsWithUser.push({
                            id: roomId,
                            otherUserId: otherUserId,
                            otherName: otherName,
                            otherRole: otherRole,
                            otherDesignation: userData?.designation || (otherRole === 'admin' ? 'এডমিন' : otherRole === 'user' ? 'ইউজার' : 'ভলান্টিয়ার'),
                            otherOnline: userData?.online || false,
                            otherLastSeen: userData?.lastSeen || 0,
                            otherAvatar: userData?.avatarUrl || '',
                            lastMessage: room.lastMessage || '',
                            lastMessageTime: room.lastMessageTime || 0,
                            unreadCount: room.unreadCount?.[currentUserId] || 0
                        });
                    }
                }
                
                roomsWithUser.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
                allChatRooms = roomsWithUser;
                
                renderChatList();
                updateBadges();
                
            } catch (error) {
                console.error("Error loading chat rooms:", error);
            }
        }

        function renderChatList() {

        // ==================== LONG-PRESS TO DELETE CHAT (Messenger style) ====================
        const LONG_PRESS_MS = 500;
        const LONG_PRESS_MOVE_TOLERANCE = 10;
        let longPressTimer = null;
        let longPressStartXY = null;
        let longPressEl = null;
        let contextMenuRoomId = null;

        function setupChatLongPress() {
            const list = document.getElementById('chatList');
            const overlay = document.getElementById('chatContextOverlay');
            const menu = document.getElementById('chatContextMenu');
            const deleteBtn = document.getElementById('chatContextDeleteBtn');
            if (!list || list.dataset.longPressBound) return;
            list.dataset.longPressBound = 'true';

            function startPress(e, el) {
                const point = e.touches ? e.touches[0] : e;
                longPressStartXY = { x: point.clientX, y: point.clientY };
                longPressEl = el;
                clearTimeout(longPressTimer);
                longPressTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(15);
                    el.classList.add('long-pressing');
                    openChatContextMenu(el, longPressStartXY.x, longPressStartXY.y);
                }, LONG_PRESS_MS);
            }

            function movePress(e) {
                if (!longPressStartXY) return;
                const point = e.touches ? e.touches[0] : e;
                const dx = Math.abs(point.clientX - longPressStartXY.x);
                const dy = Math.abs(point.clientY - longPressStartXY.y);
                if (dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) {
                    cancelPress();
                }
            }

            function cancelPress() {
                clearTimeout(longPressTimer);
                if (longPressEl) longPressEl.classList.remove('long-pressing');
                longPressStartXY = null;
            }

            list.addEventListener('touchstart', (e) => {
                const item = e.target.closest('.chat-item');
                if (item) startPress(e, item);
            }, { passive: true });
            list.addEventListener('touchmove', movePress, { passive: true });
            list.addEventListener('touchend', cancelPress);
            list.addEventListener('touchcancel', cancelPress);

            list.addEventListener('mousedown', (e) => {
                const item = e.target.closest('.chat-item');
                if (item) startPress(e, item);
            });
            list.addEventListener('mousemove', movePress);
            list.addEventListener('mouseup', cancelPress);
            list.addEventListener('mouseleave', cancelPress);
            list.addEventListener('contextmenu', (e) => {
                const item = e.target.closest('.chat-item');
                if (item) {
                    e.preventDefault();
                    openChatContextMenu(item, e.clientX, e.clientY);
                }
            });

            overlay.addEventListener('click', closeChatContextMenu);
            deleteBtn.addEventListener('click', confirmDeleteChat);
        }

        function openChatContextMenu(itemEl, x, y) {
            contextMenuRoomId = itemEl.dataset.roomId;
            const overlay = document.getElementById('chatContextOverlay');
            const menu = document.getElementById('chatContextMenu');
            overlay.classList.add('active');
            menu.classList.add('active');

            // Position within viewport bounds
            const menuWidth = 220;
            const menuHeight = 60;
            let left = Math.min(x, window.innerWidth - menuWidth - 16);
            let top = Math.min(y, window.innerHeight - menuHeight - 16);
            left = Math.max(16, left);
            top = Math.max(16, top);
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
        }

        function closeChatContextMenu() {
            document.getElementById('chatContextOverlay').classList.remove('active');
            document.getElementById('chatContextMenu').classList.remove('active');
            document.querySelectorAll('.chat-item.long-pressing').forEach(el => el.classList.remove('long-pressing'));
            contextMenuRoomId = null;
        }

        async function confirmDeleteChat() {
            const roomId = contextMenuRoomId;
            closeChatContextMenu();
            if (!roomId) return;
            if (!confirm('এই চ্যাট হিস্ট্রি ডিলিট করতে চান? এটি শুধু আপনার তালিকা থেকে সরে যাবে।')) return;

            try {
                await database.ref(`chatRooms/${roomId}/deletedFor/${currentUserId}`).set(true);
                allChatRooms = allChatRooms.filter(r => r.id !== roomId);

                showToast('চ্যাট ডিলিট করা হয়েছে');
