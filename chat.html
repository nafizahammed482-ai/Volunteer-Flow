            }
        }

        // ==================== MESSAGE LONG-PRESS (Delete/Edit/Cancel) ====================
        let msgLongPressTimer = null;
        let msgLongPressStartXY = null;
        let contextMenuMsgId = null;

        function setupMessageLongPress() {
            const area = document.getElementById('messagesArea');
            const overlay = document.getElementById('msgContextOverlay');
            const menu = document.getElementById('msgContextMenu');
            const editBtn = document.getElementById('msgEditBtn');
            const deleteForMeBtn = document.getElementById('msgDeleteForMeBtn');
            const deleteForEveryoneBtn = document.getElementById('msgDeleteForEveryoneBtn');
            const cancelBtn = document.getElementById('msgCancelBtn');
            if (!area || area.dataset.longPressBound) return;
            area.dataset.longPressBound = 'true';

            function startPress(e, rowEl) {
                const point = e.touches ? e.touches[0] : e;
                msgLongPressStartXY = { x: point.clientX, y: point.clientY };
                clearTimeout(msgLongPressTimer);
                msgLongPressTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(15);
                    openMessageContextMenu(rowEl, msgLongPressStartXY.x, msgLongPressStartXY.y);
                }, LONG_PRESS_MS);
            }

            function movePress(e) {
                if (!msgLongPressStartXY) return;
                const point = e.touches ? e.touches[0] : e;
                const dx = Math.abs(point.clientX - msgLongPressStartXY.x);
                const dy = Math.abs(point.clientY - msgLongPressStartXY.y);
                if (dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) cancelPress();
            }

            function cancelPress() {
                clearTimeout(msgLongPressTimer);
                msgLongPressStartXY = null;
            }

            area.addEventListener('touchstart', (e) => {
                const row = e.target.closest('.message-row[data-msg-id]');
                if (row) startPress(e, row);
            }, { passive: true });
            area.addEventListener('touchmove', movePress, { passive: true });
            area.addEventListener('touchend', cancelPress);
            area.addEventListener('touchcancel', cancelPress);

            area.addEventListener('mousedown', (e) => {
                const row = e.target.closest('.message-row[data-msg-id]');
                if (row) startPress(e, row);
            });
            area.addEventListener('mousemove', movePress);
            area.addEventListener('mouseup', cancelPress);
            area.addEventListener('mouseleave', cancelPress);
            area.addEventListener('contextmenu', (e) => {
                const row = e.target.closest('.message-row[data-msg-id]');
                if (row) {
                    e.preventDefault();
                    openMessageContextMenu(row, e.clientX, e.clientY);
                }
            });

            overlay.addEventListener('click', closeMessageContextMenu);
            cancelBtn.addEventListener('click', closeMessageContextMenu);
            editBtn.addEventListener('click', () => {
                const id = contextMenuMsgId;
                const msg = currentMessagesCache[id];
                closeMessageContextMenu();
                if (msg) editMessage(id, msg.text);
            });
            // NEW: "ডিলিট ফর মি" — যেকোনো মেসেজে (নিজের/অন্যের) কাজ করে, শুধু নিজের ভিউ থেকে সরায়
            deleteForMeBtn.addEventListener('click', () => {
                const id = contextMenuMsgId;
                closeMessageContextMenu();
                if (id) deleteMessage(id, 'me');
            });
            // NEW: "ডিলিট ফর এভরিওয়ান" — শুধু নিজের পাঠানো মেসেজে দেখানো হয়/কাজ করে
            deleteForEveryoneBtn.addEventListener('click', () => {
                const id = contextMenuMsgId;
                closeMessageContextMenu();
                if (id) deleteMessage(id, 'everyone');
            });
        }

        function openMessageContextMenu(rowEl, x, y) {
            const msgId = rowEl.dataset.msgId;
            const msg = currentMessagesCache[msgId];
            if (!msg) return;
            contextMenuMsgId = msgId;

            const isOwn = msg.senderId === currentUserId;
            const isTextMsg = !msg.type || msg.type === 'text';
            const alreadyDeletedForMe = !!(msg.deletedFor && msg.deletedFor[currentUserId]);
            const editBtn = document.getElementById('msgEditBtn');
            const deleteForMeBtn = document.getElementById('msgDeleteForMeBtn');
            const deleteForEveryoneBtn = document.getElementById('msgDeleteForEveryoneBtn');
            // এডিট শুধু নিজের টেক্সট মেসেজে (যেটা এখনো "সবার জন্য ডিলিট" হয়নি)
            editBtn.style.display = (isOwn && isTextMsg && !msg.deleted) ? 'flex' : 'none';
            // NEW: "ডিলিট ফর মি" যেকোনো (নিজের/অন্যের) মেসেজে দেখানো হয় — শুধু নিজের ভিউ থেকে সরায়
            deleteForMeBtn.style.display = alreadyDeletedForMe ? 'none' : 'flex';
            // NEW: "ডিলিট ফর এভরিওয়ান" শুধু নিজের পাঠানো, এখনো-ডিলিট-না-হওয়া মেসেজে দেখানো হয়
            deleteForEveryoneBtn.style.display = (isOwn && !msg.deleted) ? 'flex' : 'none';

            const overlay = document.getElementById('msgContextOverlay');
            const menu = document.getElementById('msgContextMenu');
            overlay.classList.add('active');
            menu.classList.add('active');

            const menuWidth = 210;
            const menuHeight = 170;
            let left = Math.min(x, window.innerWidth - menuWidth - 16);
            let top = Math.min(y, window.innerHeight - menuHeight - 16);
            left = Math.max(16, left);
            top = Math.max(16, top);
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
        }

        function closeMessageContextMenu() {
            document.getElementById('msgContextOverlay').classList.remove('active');
            document.getElementById('msgContextMenu').classList.remove('active');
            contextMenuMsgId = null;
        }

        // ==================== UPDATE BADGES ====================
        function updateBadges() {
            const totalUnread = allChatRooms.reduce((sum, r) => sum + (r.unreadCount || 0), 0);
            
            const chatTabBadge = document.getElementById('chatTabBadge');
            const bottomChatBadge = document.getElementById('bottomChatBadge');
            
            if (chatTabBadge) {
                chatTabBadge.textContent = totalUnread;
                chatTabBadge.style.display = totalUnread > 0 ? 'inline-flex' : 'none';
            }
            if (bottomChatBadge) {
                bottomChatBadge.textContent = totalUnread;
                bottomChatBadge.style.display = totalUnread > 0 ? 'inline-flex' : 'none';
            }
        }

        // ==================== START CHAT ====================
        async function startChatWithVolunteer(otherUserId, otherUserName) {
            const roomId = [currentUserId, otherUserId].sort().join('_');
            const roomSnapshot = await database.ref(`chatRooms/${roomId}`).once('value');
            
            if (!roomSnapshot.exists()) {
                const roomData = {
                    participants: {
                        [currentUserId]: true,
                        [otherUserId]: true
                    },
                    lastMessage: '',
                    lastMessageTime: Date.now(),
                    unreadCount: { [currentUserId]: 0, [otherUserId]: 0 },
                    createdAt: Date.now()
                };
                await database.ref(`chatRooms/${roomId}`).set(roomData);
            }
            openChat(roomId, otherUserId, otherUserName);
        }

        async function startChatWithUser(userId, userName) {
            const roomId = [currentUserId, userId].sort().join('_');
            const roomSnapshot = await database.ref(`chatRooms/${roomId}`).once('value');
            
            if (!roomSnapshot.exists()) {
                const roomData = {
                    participants: {
                        [currentUserId]: true,
                        [userId]: true
                    },
                    lastMessage: '',
                    lastMessageTime: Date.now(),
                    unreadCount: { [currentUserId]: 0, [userId]: 0 },
                    createdAt: Date.now()
                };
                await database.ref(`chatRooms/${roomId}`).set(roomData);
            }
            openChat(roomId, userId, userName);
        }

        // ==================== OPEN CHAT ====================
        async function openChat(roomId, otherUserId, otherUserName) {
            if (chatMessagesRef) chatMessagesRef.off();
            
            currentChatRoom = roomId;
            currentChatUser = { uid: otherUserId, name: otherUserName };
            
            const userSnapshot = await database.ref('users/' + otherUserId).once('value');
            const userData = userSnapshot.val();
            const otherRole = userData?.role;
            const otherDesignation = userData?.designation || (otherRole === 'admin' ? 'এডমিন' : otherRole === 'user' ? 'ইউজার' : 'ভলান্টিয়ার');

            // NEW FIX #6: নামের লাইনে আর ডেজিগনেশন জোড়া লাগানো হয় না (এতে বড় নাম আরও কম দেখা যেত) —
            // নাম একাই বসে, পুরো নাম+ডেজিগনেশন টুলটিপ (title) হিসেবে থাকে, ডেজিগনেশন আলাদা ছোট ব্যাজে দেখানো হয়
            const fullDisplayName = userData?.name || otherUserName;
            const convNameEl = document.getElementById('convName');
            convNameEl.textContent = fullDisplayName;
            convNameEl.title = `${fullDisplayName} (${otherDesignation})`;
            const convDesigEl = document.getElementById('convDesignation');
            if (convDesigEl) convDesigEl.textContent = otherDesignation;

            await database.ref(`chatRooms/${roomId}/unreadCount/${currentUserId}`).set(0);
            updateBadges();

            // Live listener for other user's photo, online status & last seen
            if (otherUserStatusRef) otherUserStatusRef.off();
            otherUserStatusRef = database.ref('users/' + otherUserId);
            otherUserStatusRef.on('value', (snap) => {
                const u = snap.val() || {};
                const isOnline = u.online || false;
                const avatarEl = document.getElementById('convAvatar');
                if (avatarEl) {
                    const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name || otherUserName || 'User')}&background=16a34a&color=fff`;
                    const src = (u.avatarUrl && u.avatarUrl.startsWith('http')) ? u.avatarUrl : fallback;
                    avatarEl.innerHTML = `<img src="${escapeHtml(src)}" alt="profile" onerror="this.src='${fallback}'">`;
                }
                const statusEl = document.getElementById('convStatus');
                if (statusEl) {
                    statusEl.innerHTML = isOnline
                        ? '<i class="fas fa-circle"></i> অনলাইন'
                        : `<i class="far fa-clock"></i> ${formatLastSeen(u.lastSeen)}`;
                    statusEl.className = `conv-user-status ${isOnline ? 'online' : ''}`;
                }
            });
            
            chatMessagesRef = database.ref(`messages/${roomId}`).orderByChild('timestamp');
            chatMessagesRef.on('value', (snapshot) => {
                const messages = [];
                snapshot.forEach(child => {
                    messages.push({ id: child.key, ...child.val() });
                });
                messages.sort((a, b) => a.timestamp - b.timestamp);
                renderMessages(messages);
            });
            
            // Typing indicator listener (আগের chat-room-এর listener থাকলে আগে detach করা হচ্ছে,
            // নাহলে chat বার বার open করলে duplicate listener জমে থাকবে)
            if (typingListenerRef) typingListenerRef.off();
            typingListenerRef = database.ref(`typing/${roomId}/${otherUserId}`);
            typingListenerRef.on('value', (snapshot) => {
                const isTyping = snapshot.val();
                const indicator = document.getElementById('typingIndicator');
                if (isTyping) {
                    indicator.classList.add('active');
                } else {
                    indicator.classList.remove('active');
                }
            });
            
            document.getElementById('conversationPage').classList.add('active');
            document.getElementById('messageInput').focus();
        }

        // ==================== RENDER MESSAGES ====================
        function renderMessages(messages) {
            const container = document.getElementById('messagesArea');
            // NEW: "ডিলিট ফর মি" করা মেসেজ নিজের ভিউ থেকে বাদ দেওয়া হয় (বাকিদের কাছে অক্ষত থাকে)
            messages = (messages || []).filter(m => !(m.deletedFor && m.deletedFor[currentUserId]));
            if (!messages || messages.length === 0) {
                container.innerHTML = `<div class="empty-placeholder">
                    <i class="fas fa-comment-dots"></i>
                    <h4>কোনো মেসেজ নেই</h4>
                    <p>এখানে আপনার মেসেজ লিখুন</p>
                </div>`;
                return;
            }
            
            // Ownership/edit/delete validation ও message long-press menu-র জন্য cache রাখা হচ্ছে
            currentMessagesCache = {};
            messages.forEach(m => { currentMessagesCache[m.id] = m; });

            let html = '';
            let lastDate = '';
            messages.forEach(msg => {
                const msgDate = formatDate(msg.timestamp);
                if (msgDate !== lastDate) {
                    html += `<div class="date-divider"><span>${msgDate}</span></div>`;
                    lastDate = msgDate;
                }

                // ---- Call log messages render as a centered divider, not a bubble ----
                if (msg.type === 'call_log') {
                    const icon = msg.callType === 'video' ? 'fa-video' : 'fa-phone';
                    let label = '';
                    let isMissed = false;
                    if (msg.outcome === 'missed') { label = 'মিসড কল'; isMissed = (msg.senderId !== currentUserId); }
                    else if (msg.outcome === 'declined') { label = 'প্রত্যাখ্যাত কল'; isMissed = true; }
                    else if (msg.outcome === 'cancelled') { label = 'বাতিল করা কল'; }
                    else { label = `কল · ${formatCallDuration(msg.duration)}`; }
                    html += `<div class="date-divider call-log-divider${isMissed ? ' missed' : ''}">
                        <span><i class="fas ${icon}"></i> ${label} · ${formatTime(msg.timestamp)}</span>
                    </div>`;
                    return;
                }

                const isSent = msg.senderId === currentUserId;
                const isEdited = msg.edited === true;
                const isMedia = msg.type === 'image' || msg.type === 'audio';
                
                // Determine message status
                let statusHtml = '';
                if (isSent) {
                    if (msg.read) {
                        statusHtml = '<span class="message-status read"><i class="fas fa-check-double"></i></span>';
                    } else if (msg.delivered) {
                        statusHtml = '<span class="message-status delivered"><i class="fas fa-check-double"></i></span>';
                    } else {
                        statusHtml = '<span class="message-status sent"><i class="fas fa-check"></i></span>';
                    }
                }

                let bodyHtml = '';
                if (msg.type === 'image') {
                    bodyHtml = `<img src="${escapeHtml(msg.url)}" class="msg-image" onclick="openImageViewer(${escapeJsAttr(msg.url)})" loading="lazy">`;
                } else if (msg.type === 'audio') {
                    const audioId = 'voiceAudio_' + msg.id;
                    bodyHtml = `<div class="voice-msg">
                        <audio id="${audioId}" preload="metadata" src="${escapeHtml(msg.url)}"></audio>
                        <button type="button" class="voice-msg-play-btn" onclick="toggleVoiceMsgPlayback('${audioId}')" title="প্লে/পজ">
                            <i class="fas fa-play"></i>
                        </button>
                        <div class="voice-msg-track" onclick="seekVoiceMsg(event, '${audioId}')">
                            <div class="voice-msg-progress" id="progress_${audioId}"></div>
                        </div>
                        <span class="voice-msg-time" id="time_${audioId}">0:00</span>
                    </div>`;
                } else {
                    bodyHtml = `${escapeHtml(msg.text)}${isEdited ? '<span class="edited-badge">(এডিটেড)</span>' : ''}`;
                }

                // ⚠️ Edit/Delete action button শুধু নিজের (sent) মেসেজেই দেখানো হয় —
                // অন্য ব্যবহারকারীর মেসেজে এই বাটন থাকবেই না (rule: অন্যের মেসেজ ডিলিট করা যাবে না)।
                // FIX: মেসেজ ইতিমধ্যে "সবার জন্য ডিলিট" হয়ে গেলে (msg.deleted === true) হোভার
                // Edit/Delete বাটন আর দেখানো হবে না — আগে এগুলো ডিলিট হওয়া প্লেসহোল্ডার টেক্সটের
                // উপরও থেকে যেত এবং ক্লিক করলে ভুলভাবে আবার এডিট/ডিলিট চালানোর চেষ্টা করতো।
                const actionsHtml = (!isSent || msg.deleted)
                    ? ''
                    : (isMedia
                        ? `<div class="message-actions"><button class="delete-btn" onclick="deleteMessage('${msg.id}')"><i class="fas fa-trash-alt"></i></button></div>`
                        : `<div class="message-actions">
                            <button class="edit-btn" onclick="editMessage('${msg.id}', ${escapeJsAttr(msg.text)})"><i class="fas fa-edit"></i></button>
                            <button class="delete-btn" onclick="deleteMessage('${msg.id}')"><i class="fas fa-trash-alt"></i></button>
                        </div>`);
                
                html += `<div class="message-row ${isSent ? 'sent' : 'received'}" data-msg-id="${msg.id}" data-sender-id="${escapeHtml(msg.senderId || '')}">
                    <div class="message-bubble">
                        ${bodyHtml}
                        ${actionsHtml}
                        <div class="message-footer">
                            <span class="message-time">${formatTime(msg.timestamp)}</span>
                            ${statusHtml}
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            initVoiceMessageEvents(container);
            setTimeout(() => {
                if (container) container.scrollTop = container.scrollHeight;
            }, 100);
        }

        // ==================== VOICE MESSAGE PLAYER (custom UI, native <audio> playback) ====================
        function toggleVoiceMsgPlayback(audioId) {
            const audioEl = document.getElementById(audioId);
            if (!audioEl) return;

            if (currentlyPlayingAudioId && currentlyPlayingAudioId !== audioId) {
                const prevAudio = document.getElementById(currentlyPlayingAudioId);
                if (prevAudio) prevAudio.pause();
            }

            if (audioEl.paused) {
                audioEl.play().catch(err => console.error('Audio play error:', err));
                currentlyPlayingAudioId = audioId;
            } else {
                audioEl.pause();
            }
        }

        function seekVoiceMsg(event, audioId) {
            const audioEl = document.getElementById(audioId);
            if (!audioEl || !audioEl.duration || !isFinite(audioEl.duration)) return;
            const track = event.currentTarget;
            const rect = track.getBoundingClientRect();
            const ratio = Math.min(Math.max((event.clientX - rect.left) / rect.width, 0), 1);
            audioEl.currentTime = ratio * audioEl.duration;
        }

        function initVoiceMessageEvents(container) {
            container.querySelectorAll('.voice-msg audio').forEach(audioEl => {
                const audioId = audioEl.id;
                const playIcon = audioEl.parentElement.querySelector('.voice-msg-play-btn i');
                const progressEl = document.getElementById('progress_' + audioId);
                const timeEl = document.getElementById('time_' + audioId);

                audioEl.addEventListener('play', () => {
                    if (playIcon) { playIcon.classList.remove('fa-play'); playIcon.classList.add('fa-pause'); }
                });
                audioEl.addEventListener('pause', () => {
                    if (playIcon) { playIcon.classList.remove('fa-pause'); playIcon.classList.add('fa-play'); }
                });
                audioEl.addEventListener('ended', () => {
                    if (playIcon) { playIcon.classList.remove('fa-pause'); playIcon.classList.add('fa-play'); }
                    if (progressEl) progressEl.style.width = '0%';
                    if (currentlyPlayingAudioId === audioId) currentlyPlayingAudioId = null;
                });
                audioEl.addEventListener('timeupdate', () => {
                    if (!audioEl.duration || !isFinite(audioEl.duration)) return;
                    if (progressEl) progressEl.style.width = `${(audioEl.currentTime / audioEl.duration) * 100}%`;
                    if (timeEl) timeEl.textContent = formatCallDuration(Math.round(audioEl.currentTime));
                });
                audioEl.addEventListener('loadedmetadata', () => {
                    if (timeEl && audioEl.duration && isFinite(audioEl.duration)) {
                        timeEl.textContent = formatCallDuration(Math.round(audioEl.duration));
                    }
                });
            });
        }

        // ==================== SEND MESSAGE ====================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChatRoom) return;
            
            const message = {
                senderId: currentUserId,
                senderName: currentUserName,
                text: text,
                timestamp: Date.now(),
                delivered: false,
                read: false,
                edited: false
            };
            
            try {
                await database.ref(`messages/${currentChatRoom}`).push(message);
                await database.ref(`chatRooms/${currentChatRoom}`).update({
                    lastMessage: text,
                    lastMessageTime: Date.now(),
                    [`unreadCount/${currentChatUser.uid}`]: firebase.database.ServerValue.increment(1),
                    [`deletedFor/${currentChatUser.uid}`]: false
                });
                
                // Mark as delivered after 1 second
                setTimeout(async () => {
                    const lastMsgSnapshot = await database.ref(`messages/${currentChatRoom}`).limitToLast(1).once('value');
                    lastMsgSnapshot.forEach(child => {
                        database.ref(`messages/${currentChatRoom}/${child.key}/delivered`).set(true);
                    });
                }, 1000);
                
                input.value = '';
                loadChatRooms();
                
                // Stop typing indicator
                database.ref(`typing/${currentChatRoom}/${currentUserId}`).set(false);
            } catch (error) {
                console.error("Send error:", error);
                showToast('মেসেজ পাঠাতে সমস্যা হয়েছে', 'error');
            }
        }

        // ==================== SEND MEDIA MESSAGE (Image / Audio) ====================
        async function sendMediaMessage(type, url) {
            if (!currentChatRoom || !currentChatUser) return;

            const previewText = type === 'image' ? '📷 ছবি' : '🎤 ভয়েস মেসেজ';
            const message = {
                senderId: currentUserId,
                senderName: currentUserName,
                type: type,
                url: url,
                text: previewText,
                timestamp: Date.now(),
                delivered: false,
                read: false,
                edited: false
            };

            try {
                await database.ref(`messages/${currentChatRoom}`).push(message);
                await database.ref(`chatRooms/${currentChatRoom}`).update({
                    lastMessage: previewText,
                    lastMessageTime: Date.now(),
                    [`unreadCount/${currentChatUser.uid}`]: firebase.database.ServerValue.increment(1),
                    [`deletedFor/${currentChatUser.uid}`]: false
                });

                setTimeout(async () => {
                    const lastMsgSnapshot = await database.ref(`messages/${currentChatRoom}`).limitToLast(1).once('value');
                    lastMsgSnapshot.forEach(child => {
                        database.ref(`messages/${currentChatRoom}/${child.key}/delivered`).set(true);
                    });
                }, 1000);

                loadChatRooms();
            } catch (error) {
                console.error('Send media error:', error);
                showToast('মেসেজ পাঠাতে সমস্যা হয়েছে', 'error');
            }
        }

        // ==================== CLOUDINARY UPLOAD ====================
        async function uploadToCloudinary(blobOrFile) {
            const formData = new FormData();
            formData.append('file', blobOrFile);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const response = await fetch(CLOUDINARY_UPLOAD_URL, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error('Cloudinary upload failed: ' + errText);
            }

            const data = await response.json();
            return data.secure_url;
        }

        // ==================== IMAGE SHARE ====================
        function compressImage(file, maxWidth = 1280, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('ফাইল পড়তে সমস্যা হয়েছে'));
                reader.onload = (e) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('ছবি লোড করতে সমস্যা হয়েছে'));
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxWidth) {
                            height = Math.round(height * (maxWidth / width));
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('ছবি প্রসেস করতে সমস্যা হয়েছে'));
                        }, 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleImageSelected(event) {
            const file = event.target.files[0];
            event.target.value = ''; // একই ছবি আবার সিলেক্ট করা যায় সেজন্য রিসেট
            if (!file || !currentChatRoom) return;

            if (!file.type.startsWith('image/')) {
                showToast('শুধু ছবি ফাইল নির্বাচন করুন', 'error');
                return;

            showToast('ছবি পাঠানো হচ্ছে...');
            try {
                const compressedBlob = await compressImage(file);
                const url = await uploadToCloudinary(compressedBlob);
                await sendMediaMessage('image', url);
            } catch (error) {
                console.error('Image send error:', error);
                showToast('ছবি পাঠাতে সমস্যা হয়েছে', 'error');

        }

        function openImageViewer(url) {
            document.getElementById('imageViewerImg').src = url;
            document.getElementById('imageViewer').classList.add('active');
            // NEW: ডাউনলোড বাটন — Cloudinary URL হলে fl_attachment ফ্ল্যাগ যোগ করে ফোর্স-ডাউনলোড করানো হয়
            const downloadBtn = document.getElementById('imageDownloadBtn');
            if (downloadBtn) {
                const downloadUrl = url.includes('/upload/') ? url.replace('/upload/', '/upload/fl_attachment/') : url;
                // FIX: আগে শুধু একটা <a> লিংক ক্লিক করানো হতো — ডাউনলোড আসলে সফল হলো নাকি ব্যর্থ
                // (নেটওয়ার্ক এরর, ভাঙা URL, CORS ইত্যাদি) তার কোনো ফিডব্যাক (টোস্ট) দেখানো হতো না।
                // এখন fetch দিয়ে আসল ফাইল আনা হচ্ছে, blob বানিয়ে ডাউনলোড করানো হচ্ছে, এবং
                // সফল/ব্যর্থ দুই ক্ষেত্রেই showToast() দিয়ে জানানো হচ্ছে।
                downloadBtn.onclick = async (e) => {
                    e.stopPropagation();
                    if (downloadBtn.dataset.downloading === 'true') return;
                    downloadBtn.dataset.downloading = 'true';
                    const originalIcon = downloadBtn.innerHTML;
                    downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    showToast('ছবি ডাউনলোড হচ্ছে...');
                    try {
                        const response = await fetch(downloadUrl);
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        const blob = await response.blob();
                        const blobUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = blobUrl;
                        a.download = 'image_' + Date.now() + '.jpg';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
                        showToast('ছবি ডাউনলোড সফল হয়েছে ✅', 'success');
                    } catch (error) {
                        console.error('Image download error:', error);
                        // Fallback: fetch/blob কাজ না করলে (যেমন CORS ব্লক) সরাসরি লিংক ওপেন করে দেখানো হচ্ছে
                        try {
                            const a = document.createElement('a');
                            a.href = downloadUrl;
                            a.download = 'image.jpg';
                            a.target = '_blank';
                            a.rel = 'noopener';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            showToast('ডাউনলোড ব্রাউজারে খোলা হয়েছে', 'info');
                        } catch (fallbackError) {
                            console.error('Image download fallback error:', fallbackError);
                            showToast('ছবি ডাউনলোড ব্যর্থ হয়েছে ❌', 'error');
                        }
                    } finally {
                        downloadBtn.dataset.downloading = 'false';
                        downloadBtn.innerHTML = originalIcon;
                    }
                };
            }
        }

        // ==================== VOICE MESSAGE ====================
        function toggleVoiceRecording() {
            if (!currentChatRoom) return;
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopVoiceRecording(true);
            } else {
                startVoiceRecording();
            }
        }

        async function startVoiceRecording() {
            if (!currentChatRoom) return;
            try {
                recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (error) {
                console.error('Mic permission error:', error);
                showToast('মাইক পারমিশন প্রয়োজন', 'error');
                return;
            }

            isRecordingCancelled = false;
            recordedChunks = [];

            let mimeType = 'audio/webm';
            if (!(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mimeType))) {
                mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : '';
            }

            try {
                mediaRecorder = mimeType ? new MediaRecorder(recordingStream, { mimeType }) : new MediaRecorder(recordingStream);
            } catch (error) {
                console.error('MediaRecorder init error:', error);
                showToast('ভয়েস রেকর্ডিং সাপোর্ট নেই', 'error');
                recordingStream.getTracks().forEach(t => t.stop());
                return;
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = onVoiceRecordingStop;

            mediaRecorder.start();
            recordingStartTs = Date.now();
            showRecordingBar();
            recordingTimerInterval = setInterval(updateRecordingTimer, 200);
        }

        function stopVoiceRecording(send) {
            isRecordingCancelled = !send;
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            if (recordingStream) {
                recordingStream.getTracks().forEach(t => t.stop());
                recordingStream = null;
            }
            clearInterval(recordingTimerInterval);
            hideRecordingBar();
        }

        async function onVoiceRecordingStop() {
            if (isRecordingCancelled) {
                recordedChunks = [];
                return;
            }
            const durationSec = Math.round((Date.now() - recordingStartTs) / 1000);
            if (durationSec < 1) {
                showToast('রেকর্ডিং অনেক ছোট, আবার চেষ্টা করুন', 'error');
                recordedChunks = [];
                return;
            }
            const blob = new Blob(recordedChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm' });
            recordedChunks = [];

            showToast('ভয়েস মেসেজ পাঠানো হচ্ছে...');
            try {
                const url = await uploadToCloudinary(blob);
                await sendMediaMessage('audio', url);
            } catch (error) {
                console.error('Voice send error:', error);
                showToast('ভয়েস মেসেজ পাঠাতে সমস্যা হয়েছে', 'error');
            }
        }

        function showRecordingBar() {
            document.getElementById('inputWrapper').style.display = 'none';
            document.getElementById('recordingBar').classList.add('active');
            document.getElementById('micBtn').classList.add('recording-active');
            updateRecordingTimer();

        function hideRecordingBar() {
            document.getElementById('inputWrapper').style.display = 'flex';
            document.getElementById('recordingBar').classList.remove('active');
            document.getElementById('micBtn').classList.remove('recording-active');
