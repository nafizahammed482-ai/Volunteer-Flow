        function updateRecordingTimer() {
            if (!recordingStartTs) return;
            const elapsed = Math.floor((Date.now() - recordingStartTs) / 1000);
            const m = Math.floor(elapsed / 60);
            const s = elapsed % 60;
            const el = document.getElementById('recordingTimer');
            if (el) el.textContent = `${m}:${String(s).padStart(2, '0')}`;
        }

        // ==================== CALLS (Jitsi Meet) ====================
        // ==================== NEW: WEBRTC CALLING (Firebase RTDB সিগন্যালিং, নিজস্ব নিয়ন্ত্রণে) ====================
        function getSignalRef(roomId) {
            return database.ref(`chatRooms/${roomId}/activeCall/signal`);
        }

        // caller ও callee দুজনেই নিজের role অনুযায়ী offer/answer/candidates আলাদা পাথে রাখে,
        // যাতে একে অপরের ডেটা ওভাররাইট না করে
        async function startWebRTCCall(roomId, callInfo, isCaller) {
            currentCallRoomId = roomId;
            currentCallInfo = callInfo;
            pendingRemoteCandidates = [];
            isSpeakerOn = true; // NEW: প্রতিটা কল শুরুতে স্পিকার বাটন ডিফল্ট (লাউড) অবস্থায় রিসেট

            const isVideo = callInfo.type === 'video';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
            } catch (err) {
                console.error('getUserMedia error:', err);
                showToast('ক্যামেরা/মাইক্রোফোন অ্যাক্সেস পাওয়া যায়নি', 'error');
                await endLiveCall('failed');
                return;
            }

            peerConnection = new RTCPeerConnection(RTC_CONFIG);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            remoteStream = new MediaStream();
            const remoteVideoEl = document.getElementById('remoteVideoEl');
            if (remoteVideoEl) remoteVideoEl.srcObject = remoteStream;
            // FIX: অপর পাশের ভিডিও/অডিও ট্র্যাক আসার সময় শুধু remoteStream-এ track যোগ করলেই
            // অনেক মোবাইল ব্রাউজারে (বিশেষ করে Safari/iOS ও কিছু WebView) ভিডিও এলিমেন্ট রিফ্রেশ হয় না,
            // ফলে শুধু নিজের ভিডিও (PIP) দেখা যায় কিন্তু অপরপক্ষের ভিডিও দেখা যায় না।
            // তাই প্রতিবার নতুন ট্র্যাক এলে srcObject আবার সেট করে দিচ্ছি এবং play() explicitly কল করছি।
            peerConnection.ontrack = (event) => {
                event.streams[0].getTracks().forEach(track => {
                    if (!remoteStream.getTracks().some(t => t.id === track.id)) {
                        remoteStream.addTrack(track);
                    }
                });
                if (remoteVideoEl) {
                    remoteVideoEl.srcObject = remoteStream;
                    const playPromise = remoteVideoEl.play();
                    if (playPromise && playPromise.catch) {
                        playPromise.catch(err => console.warn('remote video play() blocked:', err));
                    }
                }
            };

            const myRole = isCaller ? 'caller' : 'callee';
            const otherRole = isCaller ? 'callee' : 'caller';
            const signalRef = getSignalRef(roomId);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    signalRef.child(`candidates/${myRole}`).push(event.candidate.toJSON());
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection && (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed')) {
                    endLiveCall('completed');
                }
            };

            showLiveCallScreen(callInfo, isVideo);

            // দূরের পক্ষের SDP (caller-এর জন্য answer, callee-এর জন্য offer) শোনা
            const remoteSdpRef = signalRef.child(isCaller ? 'answer' : 'offer');
            remoteSdpRef.on('value', async (snap) => {
                const data = snap.val();
                if (!data || !peerConnection || peerConnection.currentRemoteDescription) return;
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    flushPendingCandidates();
                    if (!isCaller) {
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        await signalRef.child('answer').set({ type: answer.type, sdp: answer.sdp });
                    }
                } catch (err) {
                    console.error('setRemoteDescription error:', err);
                }
            });
            activeSignalRefs.push(remoteSdpRef);

            // দূরের পক্ষের ICE candidate গুলো শোনা
            const remoteCandidatesRef = signalRef.child(`candidates/${otherRole}`);
            remoteCandidatesRef.on('child_added', (snap) => {
                const candidate = snap.val();
                if (!candidate || !peerConnection) return;
                if (peerConnection.currentRemoteDescription) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(err => console.error('addIceCandidate error:', err));
                } else {
                    pendingRemoteCandidates.push(candidate);
                }
            });
            activeSignalRefs.push(remoteCandidatesRef);

            // অন্য পক্ষ কল কেটে দিলে (activeCall মুছে গেলে) নিজের পাশেও কল বন্ধ হয়ে যাবে
            activeCallWatchRef = database.ref(`chatRooms/${roomId}/activeCall`);
            activeCallWatchRef.on('value', (snap) => {
                if (!snap.exists() && isCallActive) endLiveCall('completed');
            });

            if (isCaller) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await signalRef.child('offer').set({ type: offer.type, sdp: offer.sdp });
            }

            callStartTs = Date.now();
            startCallTimer();
        }

        function flushPendingCandidates() {
            if (!peerConnection) return;
            while (pendingRemoteCandidates.length) {
                const c = pendingRemoteCandidates.shift();
                peerConnection.addIceCandidate(new RTCIceCandidate(c)).catch(err => console.error('addIceCandidate (flush) error:', err));
            }
        }

        function showLiveCallScreen(callInfo, isVideo) {
            document.getElementById('outgoingCallOverlay').classList.remove('active');
            document.getElementById('incomingCallOverlay').classList.remove('active');
            document.getElementById('callBubble').classList.remove('active');
            stopSound(dialingSound);
            stopSound(ringtoneSound);
            isCallMinimized = false;

            document.getElementById('liveCallName').textContent = (currentChatUser && currentChatUser.name) || callInfo.fromName || 'ব্যবহারকারী';
            document.getElementById('liveCallTimer').textContent = '00:00';
            document.getElementById('remoteVideoEl').style.display = isVideo ? 'block' : 'none';
            document.getElementById('localVideoEl').style.display = isVideo ? 'block' : 'none';
            document.getElementById('liveCallAudioAvatar').style.display = isVideo ? 'none' : 'flex';

            // NEW: অডিও কলে যার সাথে কথা হচ্ছে তার আসল প্রোফাইল ফটো দেখানো (আগে শুধু জেনেরিক আইকন দেখাতো)।
            // কনভারসেশন হেডারে ইতিমধ্যে লোড হওয়া ছবিটাই পুনরায় ব্যবহার করছি।
            if (!isVideo) {
                const audioAvatarEl = document.getElementById('liveCallAudioAvatar');
                const convAvatarImg = document.querySelector('#convAvatar img');
                if (audioAvatarEl) {
                    if (convAvatarImg && convAvatarImg.src) {
                        audioAvatarEl.innerHTML = `<div class="live-call-audio-avatar-photo"><img src="${convAvatarImg.src}" alt="profile"></div>`;
                    } else {
                        audioAvatarEl.innerHTML = '<i class="fas fa-user-circle"></i>';
                    }
                }
            }

            const localVideoEl = document.getElementById('localVideoEl');
            if (isVideo && localStream) {
                localVideoEl.srcObject = localStream;
                const localPlayPromise = localVideoEl.play();
                if (localPlayPromise && localPlayPromise.catch) {
                    localPlayPromise.catch(err => console.warn('local video play() blocked:', err));
                }
            }

            document.getElementById('toggleCamBtn').style.display = isVideo ? 'flex' : 'none';
            document.getElementById('toggleMicBtn').classList.remove('off');
            document.getElementById('toggleCamBtn').classList.remove('off');

            // NEW: স্পিকার বাটন প্রতি কলের শুরুতে "লাউড" আইকনে রিসেট
            const speakerBtn = document.getElementById('toggleSpeakerBtn');
            if (speakerBtn) {
                speakerBtn.classList.remove('off');
                speakerBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
            }

            document.getElementById('liveCallScreen').classList.add('active');
            isCallActive = true;
            trapBackForCall();
        }

        function startCallTimer() {
            stopCallTimer();
            callDurationInterval = setInterval(() => {
                if (!callStartTs) return;
                const secs = Math.floor((Date.now() - callStartTs) / 1000);
                const mm = String(Math.floor(secs / 60)).padStart(2, '0');
                const ss = String(secs % 60).padStart(2, '0');
                const timerEl = document.getElementById('liveCallTimer');
                if (timerEl) timerEl.textContent = `${mm}:${ss}`;
            }, 1000);
        }

        function stopCallTimer() {
            if (callDurationInterval) {
                clearInterval(callDurationInterval);
                callDurationInterval = null;
            }
        }

        function toggleMic() {
            if (!localStream) return;
            const track = localStream.getAudioTracks()[0];
            if (!track) return;
            track.enabled = !track.enabled;
            document.getElementById('toggleMicBtn').classList.toggle('off', !track.enabled);
        }

        function toggleCam() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (!track) return;
            track.enabled = !track.enabled;
            document.getElementById('toggleCamBtn').classList.toggle('off', !track.enabled);
        }

        // NEW: লাউডস্পিকার অন/অফ বাটন — অডিও যেই <video> এলিমেন্ট দিয়ে বাজছে (remoteVideoEl) তার
        // অডিও আউটপুট ডিভাইস setSinkId() দিয়ে পাল্টানোর চেষ্টা করে (স্পিকার <-> ইয়ারপিস/ডিফল্ট আউটপুট)।
        // মনে রাখতে হবে: setSinkId() সব ব্রাউজারে (বিশেষ করে iOS Safari-তে) সাপোর্ট করে না —
        // সেক্ষেত্রে ব্যবহারকারীকে টোস্ট মেসেজ দিয়ে জানানো হয়, অ্যাপ ক্র্যাশ করে না।
        async function toggleSpeaker() {
            const remoteVideoEl = document.getElementById('remoteVideoEl');
            const speakerBtn = document.getElementById('toggleSpeakerBtn');
            if (!remoteVideoEl || typeof remoteVideoEl.setSinkId !== 'function') {
                showToast('এই ব্রাউজারে স্পিকার পরিবর্তন সমর্থিত নয়', 'error');
                return;
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const outputs = devices.filter(d => d.kind === 'audiooutput');
                if (!outputs.length) {
                    showToast('কোনো অডিও আউটপুট ডিভাইস পাওয়া যায়নি', 'error');
                    return;
                }
                const nextSpeakerState = !isSpeakerOn;
                let targetDevice;
                if (nextSpeakerState) {
                    targetDevice = outputs.find(d => /speaker/i.test(d.label))
                        || outputs.find(d => d.deviceId === 'default')
                        || outputs[0];
                } else {
                    targetDevice = outputs.find(d => /earpiece|receiver/i.test(d.label))
                        || outputs.find(d => d.deviceId !== 'default')
                        || outputs[0];
                }
                await remoteVideoEl.setSinkId(targetDevice.deviceId);
                isSpeakerOn = nextSpeakerState;
                if (speakerBtn) {
                    speakerBtn.classList.toggle('off', !isSpeakerOn);
                    speakerBtn.innerHTML = isSpeakerOn ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-down"></i>';
                }
                showToast(isSpeakerOn ? 'লাউডস্পিকার চালু হয়েছে' : 'লাউডস্পিকার বন্ধ হয়েছে', 'success');
            } catch (err) {
                console.error('setSinkId error:', err);
                showToast('স্পিকার পরিবর্তন করা যায়নি', 'error');
            }
        }

        // কল শেষ (নিজে কেটেছি বা অন্য পক্ষ কেটেছে বা কানেকশন ফেইল করেছে) — সব ক্লিনআপ এখানে
        async function endLiveCall(outcome) {
            if (!isCallActive && !peerConnection) return; // ইতিমধ্যে বন্ধ, ডাবল-কল ঠেকানো হচ্ছে

            const roomId = currentCallRoomId;
            const call = currentCallInfo;
            const wasActive = isCallActive;
            const durationSec = callStartTs ? Math.round((Date.now() - callStartTs) / 1000) : 0;

            isCallActive = false;
            stopCallTimer();

            // Listener cleanup
            activeSignalRefs.forEach(ref => { try { ref.off(); } catch (e) {} });
            activeSignalRefs = [];
            if (activeCallWatchRef) { try { activeCallWatchRef.off(); } catch (e) {} activeCallWatchRef = null; }

            if (peerConnection) {
                try { peerConnection.close(); } catch (e) {}
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            remoteStream = null;

            document.getElementById('liveCallScreen').classList.remove('active');
            document.getElementById('callBubble').classList.remove('active');
            isCallMinimized = false;
            releaseBackTrap();

            if (roomId) {
                // সিগন্যালিং ডেটা ও activeCall মুছে ফেলা — পরের কলের জন্য পরিষ্কার থাকবে
                database.ref(`chatRooms/${roomId}/activeCall`).remove().catch(() => {});
                if (wasActive && call) {
                    logCallMessage(roomId, call, outcome || 'completed', durationSec);
                }
            }

            currentCallRoomId = null;
            currentCallInfo = null;
            callStartTs = null;
        }

        async function logCallMessage(roomId, call, outcome, durationSec) {
            const message = {
                senderId: call.from,
                senderName: call.fromName,
                type: 'call_log',
                callType: call.type,
                outcome: outcome,
                duration: durationSec || 0,
                timestamp: Date.now(),
                delivered: true,
                read: false
            };
            let previewText = '📞 কল';
            if (outcome === 'missed') previewText = '📵 মিসড কল';
            else if (outcome === 'declined') previewText = '❌ প্রত্যাখ্যাত কল';
            else if (outcome === 'cancelled') previewText = '➖ বাতিল করা কল';
            else previewText = `📞 কল · ${formatCallDuration(durationSec)}`;

            try {
                await database.ref(`messages/${roomId}`).push(message);
                await database.ref(`chatRooms/${roomId}`).update({
                    lastMessage: previewText,
                    lastMessageTime: Date.now()
                });
                if (roomId === currentChatRoom) loadChatRooms();
            } catch (error) {
                console.error('Call log error:', error);
            }
        }

        async function startCall(type) {
            if (!currentChatRoom || !currentChatUser) return;
            if (outgoingCallRoomId || activeIncomingCallRoomId || isCallActive) {
                showToast('ইতিমধ্যে একটি কল চলছে', 'error');
                return;
            }

            const roomId = currentChatRoom;
            const roomName = `${CALL_ROOM_PREFIX}${roomId}_${Date.now()}`;
            const callData = {
                from: currentUserId,
                fromName: currentUserName,
                to: currentChatUser.uid,
                roomName: roomName,
                type: type,
                status: 'ringing',
                timestamp: Date.now()
            };

            try {
                await database.ref(`chatRooms/${roomId}/activeCall`).set(callData);
            } catch (error) {
                console.error('Start call error:', error);
                showToast('কল শুরু করতে সমস্যা হয়েছে', 'error');
                return;
            }

            outgoingCallRoomId = roomId;
            showOutgoingCallUI(currentChatUser.name, type);
            watchOutgoingCallStatus(roomId, callData);
        }

        function showOutgoingCallUI(name, type) {
            document.getElementById('outgoingCallName').textContent = name;
            document.getElementById('outgoingCallStatusText').textContent = type === 'video' ? 'ভিডিও কল রিং হচ্ছে...' : 'অডিও কল রিং হচ্ছে...';
            document.getElementById('outgoingCallOverlay').classList.add('active');
            document.getElementById('callBubble').classList.remove('active');
            isCallMinimized = false;
            playSoundSafe(dialingSound); // NEW: কলিং/রিং-ব্যাক টোন
            trapBackForCall(); // NEW: ব্যাক বাটনে যাতে সরাসরি হোমে চলে না যায়, আগে মিনিমাইজ হয়
        }

        function hideOutgoingCallUI() {
            document.getElementById('outgoingCallOverlay').classList.remove('active');
            document.getElementById('callBubble').classList.remove('active');
            isCallMinimized = false;
            stopSound(dialingSound);
            releaseBackTrap();
        }

        function watchOutgoingCallStatus(roomId, callData) {
            outgoingCallStatusRef = database.ref(`chatRooms/${roomId}/activeCall`);
            outgoingCallTimer = setTimeout(() => handleOutgoingCallTimeout(roomId, callData), CALL_RING_TIMEOUT_MS);

            outgoingCallStatusRef.on('value', (snap) => {
                const call = snap.val();
                if (!call) return; // ইতিমধ্যে ক্লিয়ার হয়ে গেছে

                if (call.status === 'accepted') {
                    clearTimeout(outgoingCallTimer);
                    hideOutgoingCallUI();
                    cleanupOutgoingCallListener();
                    startWebRTCCall(roomId, call, true); // NEW: নিজস্ব WebRTC — caller হিসেবে
                } else if (call.status === 'declined') {
                    clearTimeout(outgoingCallTimer);
                    hideOutgoingCallUI();
                    logCallMessage(roomId, call, 'declined', 0);
                    database.ref(`chatRooms/${roomId}/activeCall`).remove();
                    cleanupOutgoingCallListener();
                }
            });
        }

        function cleanupOutgoingCallListener() {
            if (outgoingCallStatusRef) {
                outgoingCallStatusRef.off();
                outgoingCallStatusRef = null;
            }
            outgoingCallRoomId = null;
        }

        function handleOutgoingCallTimeout(roomId, callData) {
            hideOutgoingCallUI();
            logCallMessage(roomId, callData, 'missed', 0);
            database.ref(`chatRooms/${roomId}/activeCall`).remove().catch((error) => {
                console.error('Timeout cleanup error:', error);
            });
            cleanupOutgoingCallListener();
        }

        function cancelOutgoingCall() {
            if (!outgoingCallRoomId) return;
            const roomId = outgoingCallRoomId;
            clearTimeout(outgoingCallTimer);
            hideOutgoingCallUI();
            database.ref(`chatRooms/${roomId}/activeCall`).once('value').then((snap) => {
                const call = snap.val();
                if (call) logCallMessage(roomId, call, 'cancelled', 0);
                return database.ref(`chatRooms/${roomId}/activeCall`).remove();
            }).catch((error) => {
                console.error('Cancel call cleanup error:', error);
            });
            cleanupOutgoingCallListener();
        }

        // ---- Incoming calls (global — works anywhere inside chat.html) ----

        // CALL_RING_TIMEOUT_MS-এর চেয়ে পুরনো 'ringing' কল স্টেল ধরা হয় — এটাই মূলত caller-এর
        // ডিভাইস ব্যাকগ্রাউন্ডে চলে যাওয়া/বন্ধ হওয়ায় caller-side timer না চলার বিপরীতে receiver-side
        // safety-net (evidence: caller-এর 45s auto-missed timer শুধুই caller-এর নিজের browser tab-এ
        // চলে, receiver-side-এ কোনো expiry check আগে ছিল না)।
        function isCallStale(call) {
            return !call || !call.timestamp || (Date.now() - call.timestamp) > CALL_RING_TIMEOUT_MS;
        }

        function checkForIncomingCalls(allRooms) {
            if (!allRooms || !currentUserId) return;
            for (const [roomId, room] of Object.entries(allRooms)) {
                const call = room.activeCall;
                if (!call || call.status !== 'ringing') continue;
                if (!room.participants || !room.participants[currentUserId]) continue;
                if (call.from === currentUserId) continue; // নিজেরই আউটগোয়িং কল

                const callKey = `${roomId}_${call.timestamp}`;
                if (dismissedCallIds.has(callKey)) continue;

                if (isCallStale(call)) {
                    // Stale ringing call — receiver নিজে থেকে popup সরিয়ে ফেলে, দরকার হলে Firebase-ও পরিষ্কার করে
                    dismissedCallIds.add(callKey);
                    if (activeIncomingCallRoomId === roomId) hideIncomingCallPopup();
                    cleanupStaleActiveCall(roomId, call);
                    continue;
                }

                if (!activeIncomingCallRoomId) {
                    showIncomingCallPopup(roomId, call);
                }
                return; // একবারে একটাই পপআপ যথেষ্ট
            }

            // যদি এখন দেখানো কলটাই আর 'ringing' না থাকে (caller cancel করেছে), পপআপ সরিয়ে দাও
            if (activeIncomingCallRoomId) {
                const room = allRooms[activeIncomingCallRoomId];
                if (!room || !room.activeCall || room.activeCall.status !== 'ringing') {
                    hideIncomingCallPopup();
                }
            }
        }

        // স্টেল 'ringing' কল সেফলি ক্লিন করা হয় — শুধুমাত্র তখনই remove করা হয় যখন Firebase-এ
        // এখনও ঠিক একই timestamp সহ 'ringing' status বিদ্যমান থাকে, যাতে caller ইতিমধ্যে নতুন কল
        // শুরু করে থাকলে বা নিজে থেকেই cleanup করে থাকলে সেই ভিন্ন/নতুন active call overwrite না হয়।
        function cleanupStaleActiveCall(roomId, expectedCall) {
            const ref = database.ref(`chatRooms/${roomId}/activeCall`);
            ref.once('value').then((snap) => {
                const current = snap.val();
                if (current && current.status === 'ringing' && current.timestamp === expectedCall.timestamp) {
                    return ref.remove();
                }
            }).catch((error) => {
                console.error('Stale call cleanup error:', error);
            });
        }

        function showIncomingCallPopup(roomId, call) {
            activeIncomingCallRoomId = roomId;
            incomingCallData = call;
            document.getElementById('incomingCallName').textContent = call.fromName || 'ভলান্টিয়ার';
            document.getElementById('incomingCallTypeText').textContent = call.type === 'video' ? 'ইনকামিং ভিডিও কল...' : 'ইনকামিং অডিও কল...';
            document.getElementById('incomingCallOverlay').classList.add('active');
            document.getElementById('callBubble').classList.remove('active');
            isCallMinimized = false;
            if (navigator.vibrate) navigator.vibrate([300, 200, 300]);
            playSoundSafe(ringtoneSound); // NEW: ইনকামিং কল রিংটোন
            trapBackForCall(); // NEW: ব্যাক বাটনে যাতে সরাসরি হোমে চলে না যায়, আগে মিনিমাইজ হয়
        }

        function hideIncomingCallPopup() {
            document.getElementById('incomingCallOverlay').classList.remove('active');
            document.getElementById('callBubble').classList.remove('active');
            isCallMinimized = false;
            activeIncomingCallRoomId = null;
            incomingCallData = null;
            stopSound(ringtoneSound);
            releaseBackTrap();
        }

        // ==================== NEW: CALL MINIMIZE / FLOATING BUBBLE (Messenger/WhatsApp স্টাইল) ====================
        function minimizeCall() {
            if (!outgoingCallRoomId && !activeIncomingCallRoomId && !isCallActive) return;
            document.getElementById('outgoingCallOverlay').classList.remove('active');
            document.getElementById('incomingCallOverlay').classList.remove('active');
            document.getElementById('liveCallScreen').classList.remove('active'); // NEW: লাইভ কলও মিনিমাইজ হবে
            document.getElementById('callBubble').classList.add('active');
            isCallMinimized = true;
            // সাউন্ড/ভাইব্রেশন/লাইভ অডিও-ভিডিও স্ট্রিম মিনিমাইজ করলেও চলতে থাকবে, শুধু বড় UI সরে যাবে
        }

        function expandCall() {
            document.getElementById('callBubble').classList.remove('active');
            isCallMinimized = false;
            if (isCallActive) {
                document.getElementById('liveCallScreen').classList.add('active'); // NEW: লাইভ কল আবার বড় হবে
            } else if (outgoingCallRoomId) {
                document.getElementById('outgoingCallOverlay').classList.add('active');
            } else if (activeIncomingCallRoomId) {
                document.getElementById('incomingCallOverlay').classList.add('active');
            }
        }

        // NEW: ব্যাক বাটনে চাপলে সরাসরি পেইজ থেকে বেরিয়ে না গিয়ে প্রথমবার মিনিমাইজ হবে,
        // দ্বিতীয়বার ব্যাক চাপলে স্বাভাবিকভাবেই পেইজ থেকে বের হয়ে যাবে (Messenger/WhatsApp-এর মতো আচরণ)
        function trapBackForCall() {
            if (callHistoryTrapped) return;
            callHistoryTrapped = true;
            try { history.pushState({ callTrap: true }, '', location.href); } catch (e) { /* ignore */ }
        }

        function releaseBackTrap() {
            callHistoryTrapped = false;
        }

        window.addEventListener('popstate', () => {
            if ((outgoingCallRoomId || activeIncomingCallRoomId || isCallActive) && !isCallMinimized) {
                minimizeCall();
                // পরের বার ব্যাক চাপলে যেন সত্যিই পেইজ থেকে বের হতে পারে, তাই আবার একটা ট্র্যাপ স্টেট বসানো হচ্ছে
                try { history.pushState({ callTrap: true }, '', location.href); } catch (e) { /* ignore */ }
            }
        });

        async function acceptIncomingCall() {
            if (!activeIncomingCallRoomId) return;
            const roomId = activeIncomingCallRoomId;
            const call = incomingCallData;
            // ⚠️ Root cause fix: hideIncomingCallPopup() সেট করে activeIncomingCallRoomId=null,
            // কিন্তু Firebase status 'ringing' → 'accepted' আপডেট হতে একটু সময় লাগে। এই ফাঁকে
            // অন্য যেকোনো chatRooms পরিবর্তনে checkForIncomingCalls() পুনরায় চলে এবং status এখনও
            // 'ringing' দেখে একই popup আবার দেখিয়ে দিতে পারতো (accept কাজ না-করার মতো দেখাতো)।
            // dismissedCallIds-এ আগে থেকেই যোগ করে রাখলে সেই race window বন্ধ হয়ে যায়।
            dismissedCallIds.add(`${roomId}_${call.timestamp}`);
            hideIncomingCallPopup();
            try {
                await database.ref(`chatRooms/${roomId}/activeCall`).update({ status: 'accepted', acceptedAt: Date.now() });
            } catch (error) {
                console.error('Accept call error:', error);
                showToast('কল গ্রহণ করতে সমস্যা হয়েছে', 'error');
                return;
            }
            startWebRTCCall(roomId, call, false); // NEW: নিজস্ব WebRTC — callee হিসেবে
        }

        async function declineIncomingCall() {
            if (!activeIncomingCallRoomId) return;
            const roomId = activeIncomingCallRoomId;
            const call = incomingCallData;
            dismissedCallIds.add(`${roomId}_${call.timestamp}`);
            hideIncomingCallPopup();
            try {
                await database.ref(`chatRooms/${roomId}/activeCall`).update({ status: 'declined' });
            } catch (error) {
                console.error('Decline call error:', error);
                showToast('কল প্রত্যাখ্যান করতে সমস্যা হয়েছে', 'error');
            }
        }

        // ==================== QUICK REPLY ====================
        // ==================== CLOSE CONVERSATION ====================
        function closeConversation() {
            if (chatMessagesRef) chatMessagesRef.off();
            if (otherUserStatusRef) otherUserStatusRef.off();
            if (typingListenerRef) { typingListenerRef.off(); typingListenerRef = null; }
            currentChatRoom = null;
            currentChatUser = null;
            document.getElementById('conversationPage').classList.remove('active');
            loadChatRooms();
        }

        // ==================== TAB SWITCH ====================
        function switchTab(tab) {
            const chatTab = document.getElementById('chatTabContent');
            const volunteersTab = document.getElementById('volunteersTabContent');
            const buttons = document.querySelectorAll('.tab-switch-btn');
            
            if (tab === 'chat') {
                chatTab.style.display = 'block';
                volunteersTab.style.display = 'none';
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
                loadChatRooms();
            } else {
                chatTab.style.display = 'none';
                volunteersTab.style.display = 'block';
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
                loadVolunteers();
            }
        }

        // ==================== SEARCH ====================
        function handleSearch() {
            if (document.querySelector('.tab-switch-btn.active').dataset.tab === 'chat') {
                renderChatList();
            } else {
                renderVolunteerList();
            }
        }

        // ==================== HELPER FUNCTIONS ====================
        function formatTimeAgo(timestamp) {
            if (!timestamp) return '';
            const diff = Date.now() - timestamp;
            if (diff < 60000) return 'এখন';
            if (diff < 3600000) return Math.floor(diff/60000) + ' মিনিট আগে';
            if (diff < 86400000) {
                const d = new Date(timestamp);
                return (d.getHours()%12||12) + ':' + String(d.getMinutes()).padStart(2,'0');
            }
            if (diff < 172800000) return 'গতকাল';
            return new Date(timestamp).toLocaleDateString('bn-BD', {day:'numeric', month:'short'});
        }

        function avatarHtml(avatarUrl, online, name) {
            const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'User')}&background=16a34a&color=fff`;
            const src = (avatarUrl && avatarUrl.startsWith('http')) ? avatarUrl : fallback;
            const img = `<img src="${escapeHtml(src)}" alt="profile" onerror="this.src='${fallback}'">`;
            return `${img}${online ? '<div class="online-dot"></div>' : '<div class="offline-dot"></div>'}`;
        }

        function formatLastSeen(timestamp) {
            if (!timestamp) return 'অফলাইন';
            const diff = Date.now() - timestamp;
            if (diff < 60000) return 'এইমাত্র এপে ছিলেন';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' মিনিট আগে এপে ছিলেন';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' ঘন্টা আগে এপে ছিলেন';
            if (diff < 172800000) return 'গতকাল এপে ছিলেন';
            return new Date(timestamp).toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' }) + ' তারিখে এপে ছিলেন';
        }

        function formatTime(timestamp) {
            const d = new Date(timestamp);
            return (d.getHours()%12||12) + ':' + String(d.getMinutes()).padStart(2,'0') + ' ' + (d.getHours()>=12?'PM':'AM');
        }

        function formatDate(timestamp) {
            const d = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            if (d.toDateString() === today.toDateString()) return 'আজ';
            if (d.toDateString() === yesterday.toDateString()) return 'গতকাল';
            return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // FIX: মেসেজ টেক্সট / নাম / URL-এ যদি সিঙ্গেল-কোট (') থাকে (যেমন "Don't", "O'Brien"),
        // তাহলে onclick="fn('${escapeHtml(text)}')" প্যাটার্নে সেটা ইনলাইন JS স্ট্রিং ভেঙে ফেলতো —
        // ফলে Edit/Delete/চ্যাট-ওপেন/ছবি-ভিউয়ার বাটন কোনো রেসপন্সই দিতো না (কনসোলে সাইলেন্ট JS এরর)।
        // escapeHtml() দিয়ে এটা ঠিক করা যায় না, কারণ HTML entity ডিকোড হয় JS পার্স হওয়ার আগেই।
        // সমাধান: JSON.stringify দিয়ে সঠিক JS স্ট্রিং লিটারেল বানিয়ে, শুধু তার ডাবল-কোটগুলো
        // &quot; করে HTML অ্যাট্রিবিউটে নিরাপদে বসানো হচ্ছে।
        function escapeJsAttr(text) {
            return JSON.stringify(text == null ? '' : String(text)).replace(/"/g, '&quot;');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.innerHTML = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: ${type === 'error' ? '#ef4444' : 'linear-gradient(135deg, #16a34a, #15803d)'};
                color: white;
                padding: 12px 24px;
                border-radius: 30px;
                font-weight: 600;
                font-size: 14px;
                z-index: 9999;
                animation: fadeInOut 2.5s ease;
                white-space: nowrap;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // ==================== CHECK FOR REQUEST CHAT ====================
        function checkForRequestChat() {
            const userId = localStorage.getItem('chatWithUserId');
            const userName = localStorage.getItem('chatWithUserName');
            
            if (userId && userName) {
                localStorage.removeItem('chatWithUserId');
                localStorage.removeItem('chatWithUserName');
                localStorage.removeItem('chatRequestId');
                setTimeout(() => startChatWithUser(userId, userName), 800);
            }
        }

        // ==================== PUSH NOTIFICATIONS (FCM) ====================
        // NOTE: Replace this with YOUR project's VAPID key from
        // Firebase Console → Project Settings → Cloud Messaging → Web Push certificates
        const FCM_VAPID_KEY = 'PASTE_YOUR_VAPID_KEY_HERE';
        let fcmMessaging = null;

        async function setupNotifications() {
            try {
                if (!('Notification' in window) || !('serviceWorker' in navigator)) {
                    console.warn('এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই');
                    return;
                }

                // Register the service worker that handles notifications
                // when the site/app is closed or in the background.
                const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');

                let permission = Notification.permission;
                if (permission === 'default') {
                    permission = await Notification.requestPermission();
                }
                if (permission !== 'granted') {
                    console.warn('নোটিফিকেশন পারমিশন দেওয়া হয়নি');
                    return;
                }

                fcmMessaging = firebase.messaging();

                const token = await fcmMessaging.getToken({
                    vapidKey: FCM_VAPID_KEY,
                    serviceWorkerRegistration: registration
                });

                if (token && currentUserId) {
                    await database.ref('users/' + currentUserId).update({
                        fcmToken: token,
                        fcmTokenUpdatedAt: Date.now()
                    });
                }

                // Foreground messages (app open & tab focused) - show an in-app notification
                fcmMessaging.onMessage((payload) => {
                    const title = payload.notification?.title || 'নতুন মেসেজ';
                    const body = payload.notification?.body || '';
                    showToast(`💬 <b>${escapeHtml(title)}</b>: ${escapeHtml(body)}`);
                    if (document.hidden && Notification.permission === 'granted') {
                        new Notification(title, { body, icon: '/icons/icon-192.png' });
                    }
                });
            } catch (error) {
                console.error('Notification setup error:', error);
            }
        }

        // ==================== INITIALIZE ====================
        async function init() {
            const loggedIn = await checkLogin();
            if (!loggedIn) {
                window.location.href = 'login.html';
                return;
            }
            
            loadChatRooms();
            loadVolunteers();
            checkForRequestChat();
            setupChatLongPress();
            setupMessageLongPress();
            setupNotifications();
            
            // Real-time listeners
            // ⚠️ Free-tier resource optimization: আগে 'chatRooms' path-এ দুইটি আলাদা .on('value')
            // listener ছিল (একটা chat-list রিফ্রেশের জন্য, আরেকটা incoming-call check-এর জন্য) —
            // দুটোই একই ডেটার উপর কাজ করছিল বলে একটিতে merge করা হয়েছে, ফাংশনালিটি অপরিবর্তিত।
            database.ref('chatRooms').on('value', (snap) => {
                const roomsVal = snap.val() || {};
                // NEW: মেসেজ নোটিফিকেশন সাউন্ড — প্রতিটা রুমের unreadCount বেড়েছে কিনা তা তুলনা করে বাজানো হয়
                if (notifSoundReady) {
                    for (const roomId in roomsVal) {
                        const room = roomsVal[roomId];
                        if (!room.participants || !room.participants[currentUserId]) continue;
                        const newCount = (room.unreadCount && room.unreadCount[currentUserId]) || 0;
                        const prevCount = knownUnreadCounts[roomId] || 0;
                        if (newCount > prevCount) {
                            const conversationOpen = document.getElementById('conversationPage').classList.contains('active');
                            const isThisRoomOpen = currentChatRoom === roomId && conversationOpen;
                            if (!isThisRoomOpen) playSoundSafe(notifSound);
                        }
                        knownUnreadCounts[roomId] = newCount;
                    }
                } else {
                    // প্রথম স্ন্যাপশট — শুধু বর্তমান unreadCount গুলো রেকর্ড করে রাখা হয়, সাউন্ড বাজানো হয় না
                    for (const roomId in roomsVal) {
                        const room = roomsVal[roomId];
                        knownUnreadCounts[roomId] = (room.unreadCount && room.unreadCount[currentUserId]) || 0;
                    }
                    notifSoundReady = true;
                }

                if (document.querySelector('.tab-switch-btn.active').dataset.tab === 'chat') {
                    loadChatRooms();
                }
                // Global incoming-call watcher — chat.html-এর যেকোনো জায়গায় থাকলে কাজ করবে
                checkForIncomingCalls(roomsVal);
            });
            
            database.ref('users').on('value', () => {
                if (document.querySelector('.tab-switch-btn.active').dataset.tab === 'volunteers') {
                    loadVolunteers();
                }
            });
        }

        // ==================== EVENT LISTENERS ====================
        document.querySelectorAll('.tab-switch-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });
        
        document.getElementById('convBackBtn')?.addEventListener('click', closeConversation);
        document.getElementById('sendMsgBtn')?.addEventListener('click', sendMessage);
        document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('messageInput')?.addEventListener('input', handleTyping);
        document.getElementById('searchInput')?.addEventListener('input', handleSearch);

        // Image / voice / call controls
        document.getElementById('attachBtn')?.addEventListener('click', () => {
            document.getElementById('imageFileInput').click();
        });
        document.getElementById('imageFileInput')?.addEventListener('change', handleImageSelected);
        document.getElementById('micBtn')?.addEventListener('click', toggleVoiceRecording);
        document.getElementById('recordingCancelBtn')?.addEventListener('click', () => stopVoiceRecording(false));
        document.getElementById('recordingSendBtn')?.addEventListener('click', () => stopVoiceRecording(true));
        document.getElementById('audioCallBtn')?.addEventListener('click', () => startCall('audio'));
        document.getElementById('videoCallBtn')?.addEventListener('click', () => startCall('video'));
        document.getElementById('cancelOutgoingCallBtn')?.addEventListener('click', cancelOutgoingCall);
        document.getElementById('acceptCallBtn')?.addEventListener('click', acceptIncomingCall);
        document.getElementById('declineCallBtn')?.addEventListener('click', declineIncomingCall);
        // NEW: মিনিমাইজ বাটন (ফিচার #2)
        document.getElementById('minimizeOutgoingCallBtn')?.addEventListener('click', minimizeCall);
        document.getElementById('minimizeIncomingCallBtn')?.addEventListener('click', minimizeCall);
        // NEW: লাইভ WebRTC কল স্ক্রিনের বাটনসমূহ
        document.getElementById('minimizeLiveCallBtn')?.addEventListener('click', minimizeCall);
        document.getElementById('toggleMicBtn')?.addEventListener('click', toggleMic);
        document.getElementById('toggleCamBtn')?.addEventListener('click', toggleCam);
        document.getElementById('toggleSpeakerBtn')?.addEventListener('click', toggleSpeaker);
        document.getElementById('endLiveCallBtn')?.addEventListener('click', () => endLiveCall('completed'));

        // ==================== SIDEBAR & THEME ====================
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const themeToggleSidebar = document.getElementById('themeToggleSidebar');
        const logoutBtn = document.getElementById('logoutBtn');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        async function logout() {
            try {
                if (currentUserId) {
                    await database.ref('users/' + currentUserId).update({
                        online: false,
                        lastSeen: Date.now()
                    });
                }
                await auth.signOut();
                localStorage.clear();
                window.location.href = 'login.html';
            } catch (error) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
        if (overlay) overlay.addEventListener('click', toggleSidebar);
        if (themeToggleSidebar) themeToggleSidebar.addEventListener('click', toggleTheme);
        if (logoutBtn) logoutBtn.addEventListener('click', logout);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && sidebar?.classList.contains('open')) {
                toggleSidebar();
            }
        });

        // Make functions global
        window.startChatWithVolunteer = startChatWithVolunteer;
        window.startChatWithUser = startChatWithUser;
        window.openChat = openChat;
        window.sendMessage = sendMessage;
        window.closeConversation = closeConversation;
        window.editMessage = editMessage;
        window.deleteMessage = deleteMessage;
        window.openImageViewer = openImageViewer;
        window.closeImageViewer = closeImageViewer;

        initTheme();
        init();
    </script>

            <button class="iv-action-btn" onclick="closeImageViewer()" title="বন্ধ করুন"><i class="fas fa-times"></i></button>
        </div>
        <img id="imageViewerImg" src="" alt="image" onclick="event.stopPropagation()">
